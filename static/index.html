    settings: {base_url: '', api_key: '', model: '', data_dir: ''},
    // Bookmarks sidebar
    bookmarksOpen: true,
    bookmarks: [],
    newBookmarkUrl: '',
    bookmarkError: '',
    bmRenamingId: null, bmRenameText: '',  // inline bookmark rename state
    toggleBookmarks() {
      this.bookmarksOpen = !this.bookmarksOpen;
      if (this.bookmarksOpen) this.drawerOpen = false;  // the two panels are mutually exclusive
    },
    totals: {turns: 0, in: 0, out: 0, cache_read: 0, cache_creation: 0},

    // True when any reply is streaming. Derived; never a send gate.
    get anyStreaming() { return Object.keys(this.streams).length > 0; },

    drawerOpen: false,

    // Mind map overlay: a layout snapshot (nodes/edges in px) plus the canvas
    // view transform. Snapshot is taken on open and not re-laid-out while the
    // map is open, so background tree changes can't shift the user's view.
    MAP_NW: 220, MAP_NH: 112, MAP_GX: 32, MAP_GY: 90,
    mindmap: { open: false, rootId: null, centerTitle: '', nodes: [], edgesD: '', w: 0, h: 0 },
    galleryOpen: false,
    gallerySearch: '',
    mapView: { tx: 0, ty: 0, scale: 1 },
    mapAnim: false, mapDragging: false, _mapSuppressClick: false,

  toggleDrawer() {
    this.drawerOpen = !this.drawerOpen;
    if (this.drawerOpen) this.bookmarksOpen = false;  // mutually exclusive panels
  },

  async init() {
      // Alpine calls a component's init() method automatically AND evaluates
      // x-init="init()" — guard against the resulting double invocation.
      if (this._inited) return;
      this._inited = true;
      // The bookmarks drawer defaults to open on desktop only; on narrow
      // screens it would cover the whole conversation.
      if (window.innerWidth <= 768) this.bookmarksOpen = false;
      this.loadTreeWidth();
      this.loadAppearance();
      this.initDragDrop();
      this.initQuotePop();
      this.config = await (await fetch('/api/config')).json();
      await this.refreshTree();
      // Open as a top-level conversation list (one row per trunk); carets
      // drill into branches. Search still sees inside collapsed subtrees.
      this.collapseAll();
      this.refreshIcons();
      this.loadBookmarks();
      // Reconnect to any replies still generating on the server (e.g. after a
      // page refresh mid-stream): generation runs detached from the connection,
      // so we resume watching instead of losing the reply.
      this.reconnectActive();

      // Escape closes the topmost overlay: mind map > settings > gallery > bookmarks > drawer.
      window.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (this.quotePop.show) { this.quotePop.show = false; return; }
        if (this.nodeMenu.node) { this.nodeMenu.node = null; return; }
        if (this.mindmap.open) { this.closeMindmap(); return; }
        if (this.settingsOpen) { this.closeSettings(); return; }
        if (this.galleryOpen) { this.closeGallery(); return; }
        if (this.bookmarksOpen) { this.bookmarksOpen = false; return; }
        this.drawerOpen = false;
      });

      // Uploaded-file links inside message bubbles open in a new tab instead
      // of navigating the app away.
      document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href^="/api/files/"]');
        if (a) { e.preventDefault(); window.open(a.href, '_blank', 'noopener'); }
      });
    },

    async reconnectActive() {
      let ids = [];
      try {
        const data = await (await fetch('/api/active')).json();
        ids = data.active || [];
      } catch (e) { return; }
      for (const aid of ids) {
        if (this.streams[aid]) continue;  // already tracking it
        this.reconnect(aid);
      }
    },

    // Attach to an in-progress turn by assistant id and stream its remaining
    // events. Replays from index 0 to rebuild full live state (text, tools).
    async reconnect(assistantId) {
      let st = {
        userId: null, parentId: null, content: '',
        text: '', reasoning: '', tools: [], stats: '', ctx: '',
        usage: null, abortCtrl: new AbortController(), stopped: false,
        tempKey: null, assistantId, pendId: null, evIndex: 0,
        _counted: true,  // session totals were counted on the original send
      };
      this.streams = {...this.streams, [assistantId]: st};
      // Rebind to Alpine's reactive proxy for this entry: `st` above is the raw
      // object, and per-delta mutations (st.text += …) on the raw ref bypass the
      // reactive set-trap, so the streaming bubble wouldn't re-render until the
      // turn settled. Mutating the proxy makes each delta paint live.
      st = this.streams[assistantId];
      this.refreshTree();
      const onView = () => this.messages.some(m => m.id === assistantId);
      let resp;
      try {
        resp = await fetch('/api/stream/' + encodeURIComponent(assistantId) + '?from_index=0',
                           {signal: st.abortCtrl.signal});
      } catch (e) {
        const s = {...this.streams}; delete s[assistantId]; this.streams = s;
        return;
      }
      await this.consumeStream(resp, st, onView);
    },

    // Grow the composer textarea to fit its content: reset to auto so it can
    // shrink when text is deleted, then match scrollHeight. CSS caps it at
    // max-height (200px), past which overflow-y:auto kicks in and it scrolls.
    autoGrow(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    },

    // Enter in the composer: send, unless it's a newline (Shift) or part of an
    // IME composition. The 100ms guard after compositionend covers browsers
    // where compositionend is dispatched before the confirming Enter keydown.
    composerEnter(e) {
      if (e.shiftKey) return;  // newline
      if (e.isComposing || this.imeComposing) return;
      if (Date.now() - this._imeEndedAt < 100) return;
      e.preventDefault();
      this.send();
    },

    // Re-render lucide <i data-lucide> placeholders into <svg>. Alpine's x-for/
    // x-if rebuild DOM on data changes, wiping previously-rendered icons, so we
    // re-run this after any template update (via $nextTick). Purely cosmetic.
    refreshIcons() {
      this.$nextTick(() => { try { window.lucide && lucide.createIcons(); } catch (e) {} });
    },

    // Prefill the composer from an empty-state suggestion card (no send).
    useSuggestion(text) {
      this.draft = text;
      this.$nextTick(() => { const el = this.$refs.composerInput; if (el) el.focus(); });
    },

    // ---- attachments (drag-and-drop / paperclip upload) -------------------

    canSend() {
      // Allow send when there's text, or ready attachments (and none still uploading).
      if (this.attachments.some(a => a.status === 'uploading')) return false;
      return !!this.draft.trim() || this.attachments.some(a => a.status === 'ready');
    },

    fmtSize(n) {
      if (!n) return '';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
      return (n / 1024 / 1024).toFixed(1) + ' MB';
    },

    // Window-level file drag & drop. Bound natively (not via Alpine element
    // bindings) so no overlay or region can swallow the events — and a missed
    // drop never navigates the browser to the file.
    _hasFiles(e) {
      return !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'));
    },

    initDragDrop() {
      window.addEventListener('dragenter', (e) => {
        if (!this._hasFiles(e)) return;
        e.preventDefault();
        this._dragDepth++;
        this.dragActive = true;
        this.refreshIcons();
      });
      window.addEventListener('dragover', (e) => {
        if (!this._hasFiles(e)) return;
        e.preventDefault();  // required for drop to be allowed at all
        e.dataTransfer.dropEffect = 'copy';
      });
      window.addEventListener('dragleave', (e) => {
        this._dragDepth = Math.max(0, this._dragDepth - 1);
        if (this._dragDepth === 0) this.dragActive = false;
      });
      window.addEventListener('drop', (e) => {
        if (!this._hasFiles(e)) return;
        e.preventDefault();
        this._dragDepth = 0;
        this.dragActive = false;
        const files = e.dataTransfer.files;
        if (files && files.length) this.uploadFiles(files);
      });
    },

    onFilePick(e) {
      const files = e.target.files;
      if (files && files.length) this.uploadFiles(files);
      e.target.value = '';   // allow re-picking the same file
    },

    // Paste images (and files) straight into the composer.
    onPaste(e) {
      const files = e.clipboardData && e.clipboardData.files;
      if (files && files.length) {
        e.preventDefault();
        this.uploadFiles(files);
      }
    },

    // Downscale an image to max 1568px on the long edge (JPEG q0.85) so the
    // inline data URL stays token-friendly. Small images pass through as-is.
    async _downscaleImage(file) {
      const MAX_EDGE = 1568, MIN_BYTES = 300 * 1024;
      if (file.size <= MIN_BYTES) return file;
      try {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
        if (scale >= 1) { if (bmp.close) bmp.close(); return file; }
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(bmp.width * scale);
        canvas.height = Math.round(bmp.height * scale);
        canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
        if (bmp.close) bmp.close();
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
        return blob || file;
      } catch (e) {
        return file;  // not decodable — upload as-is
      }
    },

    async uploadFiles(fileList) {
      for (const file of Array.from(fileList)) {
        const isImage = (file.type || '').startsWith('image/');
        let upload = file, mime = file.type || '', filename = file.name;
        if (isImage) {
          upload = await this._downscaleImage(file);
          if (upload !== file) {
            mime = 'image/jpeg';
            filename = filename.replace(/\.[^.]+$/, '') + '.jpg';
          }
        }
        const uid = 'att-' + (++this._attachSeq);
        const raw = {uid, filename, size: upload.size || file.size, path: null,
                     status: 'uploading', kind: isImage ? 'image' : 'file', mime};
        this.attachments.push(raw);
        // Rebind to Alpine's reactive proxy: `raw` is the plain object, and
        // later mutations (att.status = 'ready') on the raw ref bypass the
        // reactive set-trap, so `canSend()` / :disabled wouldn't re-evaluate and
        // the send button stayed disabled even after the upload finished.
        const att = this.attachments[this.attachments.length - 1];
        this.refreshIcons();
        try {
          const fd = new FormData();
          fd.append('file', upload, filename);
          const resp = await fetch('/api/upload', {method: 'POST', body: fd});
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          att.path = data.path;
          att.filename = data.filename || att.filename;
          att.size = data.size || att.size;
          att.status = 'ready';
          toast('Attached ' + att.filename, 'success');
        } catch (err) {
          att.status = 'failed';
          this.status = 'upload failed: ' + err;
          toast('Upload failed: ' + err, 'error');
        }
        this.refreshIcons();
      }
    },

    removeAttachment(uid) {
      this.attachments = this.attachments.filter(a => a.uid !== uid);
      this.refreshIcons();
    },

    // ---- settings modal (model + storage) ---------------------------------

    openSettings() {
      // Prefill from the live config. Secrets are never sent back, so the
      // api_key field starts blank; leaving it blank keeps the existing key.
      const llm = (this.config && this.config.llm) || {};
      this.settings = {
        base_url: llm.base_url || '',
        api_key: '',
        model: llm.model || '',
        data_dir: (this.config && this.config.data_dir) || '',
      };
      this.settingsError = '';
      this._preModalFocus = document.activeElement;
      this.settingsOpen = true;
      this.refreshIcons();
      this.$nextTick(() => {
        const el = document.querySelector('.modal input');
        if (el) el.focus();
      });
    },

    closeSettings() {
      this.settingsOpen = false;
      const el = this._preModalFocus;
      this._preModalFocus = null;
      if (el && el.isConnected) this.$nextTick(() => el.focus());
    },

    // Browse the server's local filesystem for the storage-folder setting.
    async fsBrowse(path) {
      const p = this.fsPicker;
      p.open = true;  // open immediately so errors are visible too
      p.loading = true;
      p.error = '';
      try {
        const url = '/api/fs/list?path=' + encodeURIComponent((path || '').trim() || '~') +
                    '&hidden=' + (p.showHidden ? '1' : '0');
        const resp = await fetch(url);
        const data = await resp.json();
        if (!resp.ok) { p.error = data.detail || ('HTTP ' + resp.status); return; }
        p.path = data.path;
        p.parent = data.parent;
        p.dirs = data.dirs;
        this.refreshIcons();
      } catch (e) {
        p.error = String(e);
      } finally {
        p.loading = false;
      }
    },

    // Keep Tab cycling inside the settings modal while it is open.
    trapModalTab(e) {
      if (e.key !== 'Tab') return;
      const els = [...e.currentTarget.querySelectorAll('input, select, button')]
        .filter(el => !el.disabled);
      if (!els.length) return;
      const first = els[0], last = els[els.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    },



    async saveSettings() {
      if (this.anyStreaming) { this.settingsError = 'A reply is generating — stop it first.'; return; }
      this.settingsSaving = true;
      this.settingsError = '';
      const s = this.settings;
      const body = {data_dir: s.data_dir || ''};
      // Only send model settings if a model is provided.
      if (s.model && s.model.trim()) {
        body.base_url = s.base_url;
        body.model = s.model;
        if (s.api_key) body.api_key = s.api_key;    // blank = keep existing
      }
      try {
        const resp = await fetch('/api/settings', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        if (!resp.ok) { this.settingsError = data.detail || ('HTTP ' + resp.status); return; }
        this.config = data;
        this.closeSettings();
        toast('Settings saved', 'success');
        // Storage may have changed → reload the tree/view.
        this.selectedId = null; this.messages = [];
        await this.refreshTree();
      } catch (e) {
        this.settingsError = String(e);
      } finally {
        this.settingsSaving = false;
        this.refreshIcons();
      }
    },

    // ---- bookmarks sidebar ------------------------------------------------

    async loadBookmarks() {
      try {
        const data = await (await fetch('/api/bookmarks')).json();
        this.bookmarks = data.reverse();  // server returns oldest-first; show newest on top
        this.refreshIcons();  // the list renders async — convert the new <i data-lucide>
      } catch (e) {
        this.bookmarkError = 'Failed to load bookmarks: ' + e;
      }
    },

    async addBookmark() {
      const url = (this.newBookmarkUrl || '').trim();
      if (!url) return;
      this.bookmarkError = '';
      try {
        const resp = await fetch('/api/bookmarks', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({url}),
        });
        const data = await resp.json();
        if (!resp.ok) { this.bookmarkError = data.detail || ('HTTP ' + resp.status); return; }
        this.newBookmarkUrl = '';
        // Show immediately; background enrichment will fill title/summary shortly.
        this.bookmarks = [data, ...this.bookmarks];
        this.refreshIcons();
        // Poll a few times as the server fetches and summarizes.
        this._pollBookmarksFor(data.id);
      } catch (e) {
        this.bookmarkError = String(e);
      }
    },

    _pollBookmarksFor(bid) {
      let attempts = 0;
      const poll = async () => {
        if (attempts++ >= 12) return;  // ~60s max
        await new Promise(r => setTimeout(r, 5000));
        await this.loadBookmarks();
        const bm = this.bookmarks.find(b => b.id === bid);
        if (bm && bm.metadata && bm.metadata.enriching) {
          poll();
        }
      };
      poll();
    },

    async deleteBookmark(id) {
      if (!confirm('Delete this bookmark?')) return;
      try {
        const resp = await fetch('/api/bookmarks/' + id, {method: 'DELETE'});
        if (!resp.ok) { this.bookmarkError = await this.errDetail(resp); return; }
        await this.loadBookmarks();
      } catch (e) {
        this.bookmarkError = 'Delete failed: ' + e;
      }
    },

    // Re-extract the title and regenerate the one-sentence summary.
    async regenerateBookmark(id) {
      this.bookmarkError = '';
      const bm = this.bookmarks.find(b => b.id === id);
      if (bm) bm.metadata = {...(bm.metadata || {}), enriching: true};  // spin the icon
      try {
        const resp = await fetch('/api/bookmarks/' + id + '/refresh', {method: 'POST'});
        const data = await resp.json();
        if (!resp.ok) {
          this.bookmarkError = data.detail || ('HTTP ' + resp.status);
          if (bm) bm.metadata.enriching = false;
          return;
        }
        this.bookmarks = this.bookmarks.map(b => b.id === id ? data : b);
        this.refreshIcons();
      } catch (e) {
        this.bookmarkError = String(e);
        if (bm) bm.metadata.enriching = false;
      }
    },

    openLink(url) {
      window.open(url, '_blank', 'noopener');
    },

    async copyBookmark(b) {
      const text = [b.title || b.url, b.url, b.summary].filter(Boolean).join('\n');
      try {
        await navigator.clipboard.writeText(text);
        toast('Bookmark copied', 'success');
      } catch (e) {
        this.bookmarkError = 'Copy failed: ' + e;
      }
    },

    // Copy a conversation message's raw markdown. Streaming rows copy the
    // text generated so far.
    async copyMessage(m) {
      const st = this.streams[m.id];
      const text = st ? (st.text || '') : (m.content || '');
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        this.copiedMsgId = m.id;
        this.$nextTick(() => { try { window.lucide && lucide.createIcons(); } catch (e) {} });
        setTimeout(() => {
          if (this.copiedMsgId === m.id) {
            this.copiedMsgId = null;
            this.$nextTick(() => { try { window.lucide && lucide.createIcons(); } catch (e) {} });
          }
        }, 1500);
      } catch (e) {
        console.warn('copy failed:', e);
      }
    },

    // Inline bookmark rename; a manual title is locked against re-extraction.
    startBookmarkRename(b) {
      this.bmRenamingId = b.id;
      this.bmRenameText = b.title || '';
      this.$nextTick(() => {
        const el = document.querySelector('.bm-rename');
        if (el) { el.focus(); el.select(); }
      });
    },

    async submitBookmarkRename(id) {
      const title = this.bmRenameText.trim();
      this.bmRenamingId = null;
      const bm = this.bookmarks.find(x => x.id === id);
      if (bm && (bm.title || '') === title) return;  // unchanged
      try {
        const resp = await fetch('/api/bookmarks/' + id + '/rename', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({title}),
        });
        const data = await resp.json();
        if (!resp.ok) { this.bookmarkError = data.detail || ('HTTP ' + resp.status); return; }
        this.bookmarks = this.bookmarks.map(x =>
          x.id === id ? {...x, title: data.title, metadata: data.metadata} : x);
        this.refreshIcons();
      } catch (e) {
        this.bookmarkError = 'Rename failed: ' + e;
      }
    },

    // Seed the composer with a reading prompt for this bookmark — the user
    // reviews/edits it and sends manually (no auto-send). Always starts from
    // a fresh root: clear the current fork point so the send opens a new trunk.
    discussBookmark(b) {
      this.newTrunk();
      const title = b.title || b.url;
      const summary = b.summary || '（暂无摘要）';
      this.draft = [
        `请详细阅读并分析这篇文章：${b.url}`,
        '',
        `标题：${title}`,
        `摘要：${summary}`,
        '',
        '请对文章进行详细解读。如果需要重新获取完整正文，可以使用 web_fetch；'
        + '如果需要定位特定段落，可以使用 grep。',
      ].join('\n');
      this.bookmarksOpen = false;
      this.$nextTick(() => { const el = this.$refs.composerInput; if (el) el.focus(); });
    },

    // ---- resizable tree pane ----------------------------------------------

    TREE_MIN: 200,
    TREE_MAX_FRAC: 0.6,   // never let the tree eat more than 60% of the window

    applyTreeWidth() {
      document.getElementById('app').style.setProperty('--tree-w', this.treeWidth + 'px');
    },

    loadTreeWidth() {
      const saved = parseInt(localStorage.getItem('chatable.treeWidth') || '', 10);
      if (!isNaN(saved)) this.treeWidth = saved;
      this.treeWidth = this.clampTreeWidth(this.treeWidth);
      this.applyTreeWidth();
    },

    clampTreeWidth(px) {
      const max = Math.max(this.TREE_MIN, Math.floor(window.innerWidth * this.TREE_MAX_FRAC));
      return Math.min(max, Math.max(this.TREE_MIN, px));
    },

    startResize(ev) {
      ev.preventDefault();
      this.resizing = true;
      document.body.classList.add('col-resizing');
      document.getElementById('divider').classList.add('dragging');
      const move = (e) => {
        // The tree pane starts at the window's left edge, so its width is the
        // pointer's clientX (clamped).
        this.treeWidth = this.clampTreeWidth(e.clientX);
        this.applyTreeWidth();
      };
      const up = () => {
        this.resizing = false;
        document.body.classList.remove('col-resizing');
        document.getElementById('divider').classList.remove('dragging');
        localStorage.setItem('chatable.treeWidth', String(this.treeWidth));
        window.removeEventListener('mousemove', move);
        window.removeEventListener('mouseup', up);
      };
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
    },

    resetTreeWidth() {
      this.treeWidth = 340;
      this.applyTreeWidth();
      localStorage.setItem('chatable.treeWidth', String(this.treeWidth));
    },

    render(text) {
      return renderMarkdownWithMath(text);
    },

    toolPreview(text) {
      if (!text) return '';
      const one = text.replace(/\s+/g, ' ').trim();
      return one.length > 80 ? one.slice(0, 79) + '…' : one;
    },

    fmtUsage(u) {
      if (!u) return '';
      const inp = u.input || 0, out = u.output || 0;
      const total = u.total || (inp + out);
      const cr = u.cache_read || 0, cw = u.cache_creation || 0;
      const parts = ['in ' + inp, 'out ' + out, 'total ' + total];
      if (cr || cw) {
        const rate = inp > 0 ? Math.round(cr / inp * 100) : 0;
        parts.push('cache hit ' + cr + ' (' + rate + '%)');
        if (cw) parts.push('cache write ' + cw);
      }
      return parts.join(' · ');
    },

    async refreshTree() {
      // An explicit refresh supersedes any pending scheduled one.
      if (this._treeRefreshTimer) { clearTimeout(this._treeRefreshTimer); this._treeRefreshTimer = null; }
      this.tree = await (await fetch('/api/tree')).json();
      this.rebuildFlat();
      this.refreshIcons();
    },

    // Coalesce bursts of tree refreshes (user_node / assistant_node /
    // assistant_start arrive back-to-back at the start of every turn) into a
    // single fetch.
    scheduleTreeRefresh() {
      if (this._treeRefreshTimer) return;
      this._treeRefreshTimer = setTimeout(() => {
        this._treeRefreshTimer = null;
        this.refreshTree();
      }, 150);
    },

    rebuildFlat() {
      this.flatTree = [];
      // While searching, ignore collapse state so matches hidden inside a
      // collapsed subtree are still shown (dim/hit styling does the filtering).
      const searching = !!this.search.trim();
      // ancestors: array of booleans, one per ancestor level — true if that
      // ancestor still has a following sibling (draw a vertical line through it).
      // Descendants of a collapsed node are skipped entirely (unless searching).
      const walk = (node, ancestors) => {
        const kids = node.children || [];
        kids.forEach((c, i) => {
          const isLast = i === kids.length - 1;
          const kidCount = (c.children && c.children.length) || 0;
          const hasKids = kidCount > 0;
          const collapsed = this.collapsed.has(c.id);
          // Show the one-sentence summary as a second line when present.
          const reply_preview = c.summary || '';
          this.flatTree.push({
            ...c, depth: ancestors.length, ancestors: [...ancestors], isLast,
            hasKids, kidCount, collapsed, reply_preview,
          });
          if (hasKids && (searching || !collapsed)) walk(c, [...ancestors, !isLast]);
        });
      };
      walk(this.tree, []);
      // The x-for re-render replaces each row's <i data-lucide> caret with a
      // fresh placeholder; convert them back to SVG or the expand carets vanish.
      this.refreshIcons();
    },

    // Tree-row "⋯" menu: one button per row opens a fixed-position dropdown
    // with the export / mind map / rename / delete actions.
    openNodeMenu(n, ev) {
      if (this.nodeMenu.node && this.nodeMenu.node.id === n.id) { this.nodeMenu.node = null; return; }
      const r = ev.currentTarget.getBoundingClientRect();
      const w = 160;  // approx menu width; keep it inside the viewport
      this.nodeMenu = {
        node: n,
        x: Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)),
        y: Math.min(r.bottom + 4, window.innerHeight - 150),
      };
      this.refreshIcons();
    },

    nodeMenuAction(kind) {
      const n = this.nodeMenu.node;
      this.nodeMenu.node = null;
      if (!n) return;
      if (kind === 'export') this.exportTree(n.id);
      else if (kind === 'map') this.openMindmap(n.id);
      else if (kind === 'rename') this.startRename(n);
      else if (kind === 'delete') this.deleteNode(n);
    },

    // Inline tree-row rename: manual names lock the node against auto-titling;
    // submitting an empty title clears the lock and restores the auto flow.
    startRename(n) {
      if (n.role !== 'user' && n.role !== 'assistant') return;
      this.renamingId = n.id;
      this.renameText = n.title || '';
      this.$nextTick(() => {
        const el = document.querySelector('.rename-input');
        if (el) { el.focus(); el.select(); }
      });
    },

    async submitRename(id) {
      const title = this.renameText.trim();
      this.renamingId = null;
      const node = this.nodeById(id);
      if (node && (node.title || '') === title) return;  // unchanged
      try {
        const resp = await fetch('/api/node/' + encodeURIComponent(id) + '/rename', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({title}),
        });
        if (!resp.ok) { toast('Rename failed: ' + (await this.errDetail(resp)), 'error'); return; }
        await this.refreshTree();
      } catch (e) {
        toast('Rename failed: ' + e, 'error');
      }
    },

    // ---- tree search (title + summary + preview; highlight + dim non-matches) ---

    searchTokens() {
      return this.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
    },

    // Text a node is matched against: its title, one-line summary, and preview.
    nodeSearchText(n) {
      return ((n.title || '') + ' ' + (n.summary || '') + ' ' + (n.preview || '')).toLowerCase();
    },

    nodeMatches(n) {
      return this.nodeMatchesTokens(n, this.searchTokens());
    },

    nodeMatchesTokens(n, toks) {
      if (!toks.length) return false;
      const hay = this.nodeSearchText(n);
      return toks.every(t => hay.includes(t));  // multi-word AND
    },

    get searchSummary() {
      const toks = this.searchTokens();
      if (!toks.length) return '';
      const hits = this.flatTree.filter(n => this.nodeMatches(n)).length;
      return hits ? `${hits} match${hits === 1 ? '' : 'es'}` : 'no matches';
    },

    // Escape HTML then wrap each matched token in <mark>. Used via x-html, so
    // escaping is mandatory to avoid injecting node text as markup.
    highlight(text) {
      return this.markText(text, this.searchTokens());
    },

    markText(text, toks) {
      const esc = (s) => s.replace(/[&<>"']/g, c => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const raw = text || '';
      if (!toks.length) return esc(raw);
      // Build one regex of all tokens (escaped), case-insensitive.
      const pat = toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      let re;
      try { re = new RegExp('(' + pat + ')', 'gi'); } catch (e) { return esc(raw); }
      let out = '', last = 0, m;
      while ((m = re.exec(raw)) !== null) {
        out += esc(raw.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
        last = m.index + m[0].length;
        if (m.index === re.lastIndex) re.lastIndex++;  // guard zero-width
      }
      out += esc(raw.slice(last));
      return out;
    },

    toggleCollapse(n) {
      if (this.collapsed.has(n.id)) this.collapsed.delete(n.id);
      else this.collapsed.add(n.id);
      this.rebuildFlat();
    },

    collapseAll() {
      // Collapse every node that has children.
      const mark = (node) => {
        (node.children || []).forEach(c => {
          if (c.children && c.children.length) { this.collapsed.add(c.id); mark(c); }
        });
      };
      mark(this.tree);
      this.rebuildFlat();
    },

    expandAll() {
      this.collapsed.clear();
      this.rebuildFlat();
    },

    rowClass(n) {
      const q = this.search.trim();
      return {
        ['role-' + n.role]: true,   // per-role text tint (user vs assistant)
        selected: n.id === this.selectedId,
        onpath: this.pathIds.has(n.id) && n.id !== this.selectedId,
        notselectable: n.role !== 'assistant' && n.role !== 'user',
        // While searching, dim rows that don't match and mark those that do.
        'search-dim': !!q && !this.nodeMatches(n),
        'search-hit': !!q && this.nodeMatches(n),
      };
    },
    get pathIds() { return new Set(this.messages.map(m => m.id)); },

    get sessionStats() {
      const t = this.totals;
      if (!t.turns) return '';
      const rate = t.in > 0 ? Math.round(t.cache_read / t.in * 100) : 0;
      return `session: ${t.turns} turns · in ${t.in} · out ${t.out} · cache hit ${rate}%`;
    },

    async select(id, scrollMode = 'bottom') {
      // Streams keep running in the background regardless of which node is
      // viewed; loadPath will render live content for any streamed row on the
      // selected branch.
      // Selecting a USER node with a reply behaves like clicking that reply:
      // land on the assistant node (so the view shows the answer, and a
      // follow-up forks from it). forkParentId resolves user → its latest reply.
      // Default scroll lands at the END of the node's reply (conversation bottom).
      const resolved = this.forkParentId(id);
      this.selectedId = resolved;
      this.drawerOpen = false;
      await this.loadPath(resolved, scrollMode);
      // Reveal the selection inside the default-collapsed tree: expand its
      // ancestors (pathIds = the just-loaded path).
      let changed = false;
      for (const pid of this.pathIds) {
        if (this.collapsed.delete(pid)) changed = true;
      }
      if (changed) this.rebuildFlat();
      // Bring the selected row into view in the sidebar (e.g. after jumping
      // here from the mind map's 查看细节). No-op if the row is already
      // visible or filtered out by search.
      this.$nextTick(() => this.scrollTreeTo(resolved));
    },

    // Scroll the tree so the row for `id` is visible; only scrolls when the
    // row is outside the current viewport to avoid jarring recenters. The
    // scroll container is the #tree panel (overflow-y:auto), not .tree-list.
    scrollTreeTo(id) {
      const el = document.querySelector('.tree-list [data-nid="' + id + '"]');
      const scroller = document.getElementById('tree');
      if (!el || !scroller) return;
      const r = el.getBoundingClientRect(), lr = scroller.getBoundingClientRect();
      if (r.top < lr.top || r.bottom > lr.bottom) {
        el.scrollIntoView({ block: 'center' });
      }
    },

    // Find a node anywhere in the tree by id (depth-first).
    nodeById(id, node = null) {
      const start = node || this.tree;
      for (const c of (start.children || [])) {
        if (c.id === id) return c;
        const hit = this.nodeById(id, c);
        if (hit) return hit;
      }
      return null;
    },

    // The effective parent for a new message. A user node is not itself a fork
    // point for follow-ups: continue from its assistant reply instead. If the
    // question has multiple replies, use the most recent (last) one. Falls back
    // to the id itself (assistant node, or a user node with no reply yet).
    forkParentId(id) {
      if (!id) return id;
      const node = this.nodeById(id);
      if (node && node.role === 'user') {
        const replies = (node.children || []).filter(c => c.role === 'assistant');
        if (replies.length) return replies[replies.length - 1].id;
      }
      return id;
    },
    newTrunk() { this.selectedId = null; this.messages = []; },
    forkFromHere(id) {
      this.selectedId = id;
      this.$nextTick(() => { const el = this.$refs.composerInput; if (el) el.focus(); });
    },

    // ---- quote-fork popup (select text in a bubble → follow-up on it) ------

    initQuotePop() {
      const msgs = document.getElementById('messages');
      // Judge the selection once the mouse is released (shift+click extension
      // also ends with a mouseup). setTimeout lets the selection settle first.
      msgs.addEventListener('mouseup', () => setTimeout(() => this.updateQuotePop(), 0));
      // Selection cleared (click elsewhere, keyboard, programmatic) → hide.
      document.addEventListener('selectionchange', () => {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) this.quotePop.show = false;
      });
      // Scrolling the conversation invalidates the popup's fixed position.
      msgs.addEventListener('scroll', () => { this.quotePop.show = false; }, {passive: true});
    },

    // Show the popup if the current selection is usable: non-trivial text
    // fully inside ONE non-streaming message bubble.
    updateQuotePop() {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) { this.quotePop.show = false; return; }
      const text = sel.toString().trim();
      if (text.length < 2) { this.quotePop.show = false; return; }
      const a = sel.anchorNode && sel.anchorNode.parentElement;
      const f = sel.focusNode && sel.focusNode.parentElement;
      const bA = a && a.closest('.bubble'), bF = f && f.closest('.bubble');
      if (!bA || bA !== bF || bA.classList.contains('streaming-bubble')) {
        this.quotePop.show = false; return;
      }
      const msgEl = bA.closest('.msg');   // id="msg-<nodeId>"
      if (!msgEl || !msgEl.id.startsWith('msg-')) { this.quotePop.show = false; return; }
      // Convert the selected rendered HTML back to markdown so code fences,
      // inline code and KaTeX formulas survive as source, not flattened text.
      let md = this.fragmentToMarkdown(sel.getRangeAt(0).cloneContents())
                 .replace(/\n{3,}/g, '\n\n').trim() || text;
      if (md.length > 500) {
        md = md.slice(0, 500);
        // Truncation may cut a code fence in half — close it so the quote
        // still renders as a block instead of swallowing the follow-up text.
        if ((md.match(/```/g) || []).length % 2) md += '\n```';
      }
      // Float above the selection, horizontally centered, clamped to viewport.
      const r = sel.getRangeAt(0).getBoundingClientRect();
      const x = Math.min(Math.max(r.left + r.width / 2 - 40, 8), window.innerWidth - 100);
      const y = Math.max(r.top - 40, 8);
      this.quotePop = {show: true, x, y, text: md, msgId: msgEl.id.slice(4)};
      this.refreshIcons();
    },

    // Rendered-bubble HTML → markdown, covering what renderMarkdownWithMath
    // can emit: headings, bold/italic, links, lists, code (block + inline),
    // KaTeX (source recovered from the embedded annotation), images.
    fragmentToMarkdown(root) {
      const walk = (node) => {
        if (node.nodeType === Node.TEXT_NODE) return node.nodeValue;
        if (node.nodeType !== Node.ELEMENT_NODE &&
            node.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) return '';
        const el = node;
        const cls = el.classList || {contains: () => false};
        if (cls.contains('copy-btn')) return '';   // injected UI, not content
        if (cls.contains('katex')) {
          const ann = el.querySelector('annotation[encoding="application/x-tex"]');
          const tex = (ann ? ann.textContent : el.textContent).trim();
          const display = el.parentElement && el.parentElement.classList &&
                          el.parentElement.classList.contains('katex-display');
          return display ? `\n$$\n${tex}\n$$\n` : `$${tex}$`;
        }
        const kids = () => Array.from(el.childNodes).map(walk).join('');
        const tag = el.tagName ? el.tagName.toLowerCase() : '';
        switch (tag) {
          case 'pre': {
            // Skip the injected copy button; keep the raw code text.
            const code = Array.from(el.childNodes)
              .filter(n => !(n.nodeType === 1 && n.classList.contains('copy-btn')))
              .map(n => n.textContent).join('').replace(/\n$/, '');
            return `\n\`\`\`\n${code}\n\`\`\`\n`;
          }
          case 'code': return '`' + el.textContent + '`';
          case 'strong': case 'b': return '**' + kids() + '**';
          case 'em': case 'i': return '*' + kids() + '*';
          case 'a': return '[' + kids() + '](' + (el.getAttribute('href') || '') + ')';
          case 'li': return '- ' + kids().trim() + '\n';
          case 'ul': case 'ol': return '\n' + kids();
          case 'blockquote':
            return kids().trim().split('\n').map(l => '> ' + l).join('\n') + '\n';
          case 'br': return '\n';
          case 'h1': case 'h2': case 'h3': case 'h4': case 'h5': case 'h6':
            return '\n' + '#'.repeat(Number(tag[1])) + ' ' + kids().trim() + '\n';
          case 'img': return el.getAttribute('alt') || '';
          case 'p': case 'div': return kids() + '\n';
          default: return kids();
        }
      };
      return walk(root);
    },

    // Prefill the composer with the quote as a markdown blockquote and fork
    // from the message it was selected in. send() resolves a user-node fork
    // to its assistant reply via forkParentId, same as the 追问 button.
    quoteAsk() {
      const q = this.quotePop.text, id = this.quotePop.msgId;
      this.quotePop.show = false;
      window.getSelection().removeAllRanges();
      this.draft = q.split('\n').map(l => '> ' + l).join('\n') + '\n\n';
      this.forkFromHere(id);
    },

    // ---- mind map overlay ------------------------------------------------

    exportTree(id) {
      // The server sets the filename via Content-Disposition.
      const a = document.createElement('a');
      a.href = '/api/export/' + encodeURIComponent(id);
      a.download = '';
      document.body.appendChild(a);
      a.click();
      a.remove();
    },

    openMindmap(id) {
      const layout = this.layoutMindmap(id);
      if (!layout) return;
      const center = layout.nodes.find(n => n.isCenter);
      this.mindmap = { open: true, rootId: id,
                       centerTitle: (center && (center.q || center.a)) || '',
                       ...layout };
      this.mapView = { tx: 0, ty: 0, scale: 1 };
      this.refreshIcons();
      this.$nextTick(() => { this.centerOnNode(id, false); this.refreshIcons(); });
    },

    closeMindmap() { this.mindmap.open = false; },

    // ---- gallery (all trunk conversations as cards) -----------------------

    // One card per trunk: the root question plus its latest reply's gist —
    // same content pairing as the mind-map cards.
    get galleryItems() {
      return (this.tree.children || []).map(t => {
        const replies = (t.children || []).filter(c => c.role === 'assistant');
        const reply = replies.length ? replies[replies.length - 1] : null;
        return {
          id: t.id,
          replyId: reply ? reply.id : null,
          node: t,  // full trunk node, for subtree search
          q: t.title || t.preview || '(untitled)',
          a: reply ? (reply.summary || reply.title || reply.preview || '') : '',
        };
      });
    },

    toggleGallery() {
      this.galleryOpen = !this.galleryOpen;
      if (this.galleryOpen) { this.drawerOpen = false; this.bookmarksOpen = false; }
      this.refreshIcons();
    },

    closeGallery() { this.galleryOpen = false; this.gallerySearch = ''; },

    // ---- gallery search: matching cards highlighted, the rest dimmed ----

    gallerySearchTokens() {
      return this.gallerySearch.trim().toLowerCase().split(/\s+/).filter(Boolean);
    },

    galleryCardMatches(g) {
      // Same rule as the sidebar search: a card matches if ANY node in its
      // tree matches (title/summary/preview, multi-word AND) — a hit on a
      // child node highlights the whole conversation card.
      const toks = this.gallerySearchTokens();
      if (!toks.length) return false;
      const hit = (n) => this.nodeMatchesTokens(n, toks) ||
                         (n.children || []).some(c => hit(c));
      return g.node ? hit(g.node) : false;
    },

    galleryCardClass(g) {
      if (!this.gallerySearchTokens().length) return {};
      return this.galleryCardMatches(g) ? {'search-hit': true} : {'search-dim': true};
    },

    galleryHighlight(text) {
      return this.markText(text, this.gallerySearchTokens());
    },

    get galleryCountText() {
      const total = this.galleryItems.length;
      const toks = this.gallerySearchTokens();
      if (!toks.length) return total + ' conversations';
      const hits = this.galleryItems.filter(g => this.galleryCardMatches(g)).length;
      return `${hits} / ${total} conversations`;
    },

    async galleryDelete(g) {
      await this.deleteNode({id: g.id, title: g.q});  // confirm + cascade + refresh
      this.refreshIcons();
    },

    galleryDetail(g) {
      this.galleryOpen = false;
      this.select(g.id);
    },

    galleryMap(g) {
      this.galleryOpen = false;
      this.openMindmap(g.id);
    },

    // Tidy-tree layout of the clicked node's OWN tree: the top-level trunk
    // that contains it (siblings, uncles, cousins included) — other trunks
    // under the synthetic ROOT are separate trees and stay hidden. Leaves
    // share the x axis in DFS order; each parent sits at the midpoint of its
    // children. Cards are conversation TURNS (user + latest reply), built by
    // buildPairTree.
    layoutMindmap(rootId) {
      const trunk = (this.tree.children || [])
        .find(c => c.id === rootId || this.nodeById(rootId, c));
      if (!trunk) return null;
      const pairRoot = this.buildPairTree(trunk);
      const NW = this.MAP_NW, NH = this.MAP_NH, GX = this.MAP_GX, GY = this.MAP_GY;
      const nodes = [], edgePairs = [];
      let cursor = 0;
      const placeSubtree = (node, depth, emit) => {
        const kids = node.children || [];
        const childPos = kids.map(k => placeSubtree(k, depth + 1, true));
        let x;
        if (childPos.length) {
          x = (childPos[0].x + childPos[childPos.length - 1].x) / 2;
        } else {
          x = cursor; cursor += NW + GX;
        }
        if (!emit) return { x };
        const pos = { id: node.id, replyId: node.replyId, isPair: node.isPair,
                      q: node.q, a: node.a, kidCount: kids.length,
                      x, y: depth * (NH + GY),
                      isTrunk: depth === 0,
                      isCenter: node.id === rootId || node.replyId === rootId };
        nodes.push(pos);
        childPos.forEach(cp => edgePairs.push([pos, cp]));
        return pos;
      };
      // Lay out the trunk subtree; the trunk itself gets the top-row card.
      placeSubtree(pairRoot, 0, true);
      if (!nodes.length) return null;
      // Normalize so the bounding box's top-left sits at (PAD, PAD).
      const PAD = 60;
      const minX = Math.min(...nodes.map(n => n.x)) - PAD;
      const minY = Math.min(...nodes.map(n => n.y)) - PAD;
      nodes.forEach(n => { n.x -= minX; n.y -= minY; });
      const w = Math.max(...nodes.map(n => n.x + NW)) + PAD;
      const h = Math.max(...nodes.map(n => n.y + NH)) + PAD;
      // Edges are merged into a single path string so the SVG needs no
      // per-edge template loop.
      const edgesD = edgePairs.map(([a, b]) => this._mapEdgeD(a, b)).join(' ');
      return { nodes, edgesD, w, h };
    },

    // Merge each turn (a user node + its latest assistant reply) into one
    // card node for the mind map. Extra replies beside the chosen one (rare)
    // become assistant-only cards so no branch information is lost.
    buildPairTree(node) {
      if (node.role === 'user') {
        const kids = node.children || [];
        const replies = kids.filter(c => c.role === 'assistant');
        const reply = replies.length ? replies[replies.length - 1] : null;
        const children = [];
        if (reply) {
          for (const c of (reply.children || [])) children.push(this.buildPairTree(c));
        }
        for (const c of replies.slice(0, -1)) children.push(this.buildPairTree(c));
        return {
          id: node.id,
          replyId: reply ? reply.id : null,
          isPair: true,
          q: node.title || node.preview || '(untitled)',
          a: reply ? (reply.summary || reply.title || reply.reply_preview || reply.preview || '') : '',
          children,
        };
      }
      // Unpaired assistant card (an extra reply beside the chosen one).
      return {
        id: node.id,
        replyId: node.id,
        isPair: false,
        q: '',
        a: node.summary || node.title || node.reply_preview || node.preview || '(empty)',
        children: (node.children || []).map(c => this.buildPairTree(c)),
      };
    },

    // Vertical S-curve between two laid-out cards (works in both directions).
    _mapEdgeD(a, b) {
      const NW = this.MAP_NW, NH = this.MAP_NH;
      const x1 = a.x + NW / 2, y1 = a.y + (a.y <= b.y ? NH : 0);
      const x2 = b.x + NW / 2, y2 = b.y + (a.y <= b.y ? 0 : NH);
      const my = (y1 + y2) / 2;
      return `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
    },

    // Pan the canvas so a node lands in the viewport center. Only the view
    // transform changes — the layout (and sibling positions) is untouched.
    centerOnNode(id, animate = true) {
      // Cards are keyed by user id; an assistant id matches via its replyId.
      const n = this.mindmap.nodes.find(m => m.id === id || m.replyId === id);
      const cv = this.$refs.mapCanvas;
      if (!n || !cv) return;
      this.mapAnim = animate;
      const s = this.mapView.scale;
      this.mapView.tx = cv.clientWidth / 2 - (n.x + this.MAP_NW / 2) * s;
      this.mapView.ty = cv.clientHeight / 2 - (n.y + this.MAP_NH / 2) * s;
      if (animate) setTimeout(() => { this.mapAnim = false; }, 350);
    },

    mapNodeClick(mn) {
      // A drag ending on a node shouldn't recenter — treat it as panning.
      if (this._mapSuppressClick) { this._mapSuppressClick = false; return; }
      this.centerOnNode(mn.id, true);
    },

    mapShowDetail(id) {
      this.mindmap.open = false;
      this.select(id);
    },

    // Direct parent of a node within its trunk, or null when the node is the
    // trunk root (its parent is the synthetic ROOT, which has no card).
    mapParentId(id) {
      const find = (node) => {
        for (const c of (node.children || [])) {
          if (c.id === id) return node;
          const hit = find(c);
          if (hit) return hit;
        }
        return null;
      };
      for (const top of (this.tree.children || [])) {
        if (top.id === id) return null;
        const p = find(top);
        if (p) return p.id;
      }
      return null;
    },

    // Delete a node (and its subtree) from inside the mind map. Reuses the
    // tree panel's deleteNode (confirm dialog, selection reset, tree refresh).
    // Afterwards the view re-centers on the deleted node's parent; if the
    // node had no parent (it was the trunk root), the map closes and the user
    // is back at the conversation.
    async mapDeleteNode(mn) {
      const parentId = this.mapParentId(mn.id);
      await this.deleteNode(mn);
      if (!this.mindmap.open) return;
      if (this.nodeById(mn.id)) return;              // user cancelled the confirm
      if (!parentId) {                               // trunk root deleted → back to chat
        this.mindmap.open = false;
        return;
      }
      // Re-layout around the surviving center node if it is still on the tree,
      // otherwise around the parent (same trunk either way).
      const anchor = this.nodeById(this.mindmap.rootId) ? this.mindmap.rootId : parentId;
      const layout = this.layoutMindmap(anchor);
      if (!layout) { this.mindmap.open = false; return; }
      const center = layout.nodes.find(n => n.isCenter);
      this.mindmap = { open: true, rootId: anchor,
                       centerTitle: (center && (center.q || center.a)) || '',
                       ...layout };
      // The tree parent is the previous turn's assistant node; its card is
      // keyed by the user id, so match via replyId.
      const target = layout.nodes.find(n => n.replyId === parentId || n.id === parentId);
      this.$nextTick(() => { if (target) this.centerOnNode(target.id, true); this.refreshIcons(); });
    },

    // Drag anywhere on the canvas to pan; under ~4px of movement the gesture
    // counts as a click, not a pan.
    mapPointerDown(e) {
      if (e.button !== 0) return;
      const sx = e.clientX, sy = e.clientY, tx0 = this.mapView.tx, ty0 = this.mapView.ty;
      let moved = false;
      const move = (ev) => {
        if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) <= 4) return;
        moved = true;
        this.mapDragging = true;
        this.mapView.tx = tx0 + (ev.clientX - sx);
        this.mapView.ty = ty0 + (ev.clientY - sy);
      };
      const up = () => {
        this.mapDragging = false;
        this._mapSuppressClick = moved;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    },

    // Zoom around the pointer position, clamped to [0.4, 2].
    mapWheel(e) {
      const s0 = this.mapView.scale;
      const s1 = Math.min(2, Math.max(0.4, s0 * (e.deltaY < 0 ? 1.1 : 0.9)));
      if (s1 === s0) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const px = e.clientX - rect.left, py = e.clientY - rect.top;
      this.mapZoomTo(s1, px, py);
    },

    // Toolbar +/- buttons: zoom around the canvas centre, same math as the wheel.
    mapZoom(factor) {
      const cv = this.$refs.mapCanvas;
      if (!cv) return;
      this.mapZoomTo(this.mapView.scale * factor, cv.clientWidth / 2, cv.clientHeight / 2);
    },

    // Shared zoom math: keep the canvas point (px, py) stationary while
    // scaling, clamped to [0.4, 2].
    mapZoomTo(scale, px, py) {
      const s0 = this.mapView.scale;
      const s1 = Math.min(2, Math.max(0.4, scale));
      if (s1 === s0) return;
      const wx = (px - this.mapView.tx) / s0, wy = (py - this.mapView.ty) / s0;
      this.mapView.tx = px - wx * s1;
      this.mapView.ty = py - wy * s1;
      this.mapView.scale = s1;
    },

    // Regenerate the reply to a user message: the server deletes all assistant
    // subtrees under it and starts a fresh turn from the same question.
    // Retry = delete the whole turn (question subtree included) and put the
    // question back in the composer for editing; the user re-sends manually.
    async retryUserNode(userId) {
      if (this.streamKeyFor(userId)) return;  // still generating (button hidden)
      let detail;
      try {
        const resp = await fetch('/api/node/' + encodeURIComponent(userId));
        if (!resp.ok) throw new Error(await this.errDetail(resp));
        detail = await resp.json();
        const del = await fetch('/api/delete/' + encodeURIComponent(userId), {method: 'POST'});
        if (!del.ok) throw new Error(await this.errDetail(del));
      } catch (e) {
        toast('Retry failed: ' + (e && e.message ? e.message : e), 'error');
        return;
      }
      // Restore the original typed text (strip the attachment block prepended
      // at send time) and rebuild ready attachment chips.
      this.draft = this._stripAttachmentPreamble(detail.content || '');
      const atts = (detail.metadata && detail.metadata.attachments) || [];
      this.attachments = atts.map(a => ({
        uid: 'att-' + (++this._attachSeq),
        filename: a.filename, path: a.path, mime: a.mime || '', size: 0,
        status: 'ready',
        kind: String(a.mime || '').startsWith('image/') ? 'image' : 'file',
      }));
      this.refreshIcons();
      // Fork from the deleted node's parent so the re-sent turn lands exactly
      // where the old one was (parent null = new trunk).
      this.selectedId = detail.parent_id || null;
      await this.refreshTree();
      await this.loadPath(this.selectedId, 'bottom');
      this.$nextTick(() => { const el = this.$refs.composerInput; if (el) el.focus(); });
    },

    // Remove the machine-facing attachment block we prepend at send time.
    _stripAttachmentPreamble(content) {
      if (!content) return '';
      let text = content;
      if (text.startsWith('Attached image(s)')) {
        const nl = text.indexOf('\n');
        text = nl === -1 ? '' : text.slice(nl + 1).replace(/^\s+/, '');
      }
      if (text.startsWith('Attached file(s)')) {
        const lines = text.split('\n');
        let i = 1;
        while (i < lines.length && lines[i].startsWith('- ')) i++;
        text = lines.slice(i).join('\n');
      }
      return text.replace(/^\s+/, '');
    },

    async deleteNode(n) {
      const label = (n.title || n.preview || n.q || n.a || n.id).slice(0, 40);
      if (!confirm(`Delete node #${n.id.slice(0,6)} "${label}" and ALL its children?`)) return;
      let resp;
      try {
        resp = await fetch('/api/delete/' + encodeURIComponent(n.id), {method: 'POST'});
      } catch (e) {
        toast('Delete failed: ' + (e && e.message ? e.message : e), 'error');
        return;
      }
      if (!resp.ok) {
        toast('Delete failed: ' + (await this.errDetail(resp)), 'error');
        return;
      }
      // if the deleted subtree contained the current selection, reset the view
      if (this.selectedId && (this.selectedId === n.id || this.pathIds.has(n.id))) {
        this.selectedId = null;
        this.messages = [];
      }
      await this.refreshTree();
      toast('Node deleted', 'success');
      // if the current selection no longer exists after refresh, clear it
      if (this.selectedId && !this.flatTree.some(x => x.id === this.selectedId)) {
        this.selectedId = null;
        this.messages = [];
      }
    },

    async loadPath(id, scrollMode = 'top') {
      if (!id) { this.messages = []; return; }
      const data = await (await fetch('/api/path/' + id)).json();
      this.messages = data.messages;
      this.refreshIcons();
      // 'top'    : land at the start of the selected node (clicking to read it).
      // 'bottom' : jump to the end (e.g. after sending, to watch the answer).
      if (scrollMode === 'bottom') {
        this.$nextTick(() => this.scrollToBottomNow());
      } else {
        this.$nextTick(() => this.scrollNodeToTop(id));
      }
    },

    scrollNodeToTop(id) {
      // Bring the selected node's heading to the top of the conversation pane.
      // The user is reading from its start, not following streamed output.
      this.stickToBottom = false;
      const el = document.getElementById('messages');
      const target = document.getElementById('msg-' + id);
      if (!el || !target) return;
      const align = () => {
        // Position-agnostic: offset target relative to the scroll container.
        el.scrollTop = target.offsetTop - el.offsetTop;
      };
      align();
      // Markdown + KaTeX render asynchronously and change earlier nodes' heights,
      // which shifts the target. Re-align on the next frames so the final
      // resting position is correct.
      requestAnimationFrame(align);
      setTimeout(align, 120);
    },

    scrollDown() {
      // Only follow new content if the user is already parked at the bottom.
      // If they scrolled up to read, leave their viewport untouched.
      if (!this.stickToBottom) return;
      const el = document.getElementById('messages');
      if (el) el.scrollTop = el.scrollHeight;
    },

    scrollToBottomNow() {
      // Unconditional scroll, used when the user themselves triggers a view
      // change (sending a message, selecting a node).
      this.stickToBottom = true;
      const el = document.getElementById('messages');
      if (el) el.scrollTop = el.scrollHeight;
    },

    onScroll() {
      const el = document.getElementById('messages');
      if (!el) return;
      // Within ~40px of the bottom counts as "at bottom" (tolerates rounding
      // and the last line's padding).
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      this.stickToBottom = atBottom;
    },

    async send() {
      const typed = this.draft.trim();
      // Ready (successfully uploaded) attachments for this turn.
      const ready = this.attachments.filter(a => a.status === 'ready' && a.path);
      if (this.attachments.some(a => a.status === 'uploading')) return;  // wait for uploads
      if (!typed && !ready.length) return;
      // Resolve the fork point. If a USER node is selected, a follow-up should
      // continue from that question's assistant reply — not re-fork the question
      // — so redirect the parent to the user node's assistant child.
      const parentId = this.forkParentId(this.selectedId);
      // Concurrent sends are allowed, even from the same fork point — siblings
      // are natural in a tree structure. Each stream runs independently.

      // Compose the message: prepend an attachment block that points the model
      // at the uploaded files by their server-side path (web_fetch reads them,
      // incl. PDF text extraction). The block is part of the persisted message.
      // Images are NOT in that block — they travel as inline vision parts.
      let content = typed;
      const files = ready.filter(a => a.kind !== 'image');
      const images = ready.filter(a => a.kind === 'image');
      if (files.length) {
        // Markdown link: the UI bubble renders it clickable (new tab), while
        // the model still gets the exact server-side path for web_fetch.
        const lines = files.map(a =>
          `- [${a.filename}](/api/files/${encodeURIComponent(a.filename)}): ${a.path}`).join('\n');
        const preamble =
          `Attached file(s) — read them with web_fetch using the exact path shown, ` +
          `then answer:\n${lines}`;
        content = typed ? `${preamble}\n\n${typed}` : preamble;
      }
      if (images.length) {
        const names = images.map(a => a.filename).join(', ');
        const note = `Attached image(s) are provided inline in this message: ${names}`;
        content = content ? `${note}\n\n${content}` : note;
      }
      this.draft = '';
      this.attachments = [];

      // Per-stream state. Keyed by a temp id until the real assistant id arrives.
      const tempKey = 'temp-' + (++this._tmpSeq);
      let st = {
        userId: null, parentId, content,
        // Raw composer state for this turn, so a stop can restore it for editing.
        typed, attachments: ready.slice(),
        text: '', reasoning: '', tools: [], stats: '', ctx: '',
        usage: null, abortCtrl: new AbortController(), stopped: false,
        tempKey, assistantId: null, pendId: tempKey + '-user',
        evIndex: 0,   // count of SSE events consumed, for reconnect offset
      };
      this.streams = {...this.streams, [tempKey]: st};
      // Rebind to Alpine's reactive proxy: the object above is raw, and per-delta
      // mutations (st.text += …) on the raw ref bypass the reactive set-trap, so
      // the streaming bubble wouldn't re-render until the turn settled. Mutating
      // the proxy instead makes each delta paint live.
      st = this.streams[tempKey];

      // This turn is being sent from the currently-viewed branch, so show the
      // user's message immediately. (If the user navigates away, the row simply
      // won't be in `messages` and we skip view updates for this stream.)
      const pendId = st.pendId;
      this.messages.push({id: pendId, role: 'user', content,
                          attachments: ready.map(a => ({filename: a.filename, path: a.path, mime: a.mime}))});
      this.stickToBottom = true;
      this.refreshIcons();
      this.$nextTick(() => this.scrollToBottomNow());

      // Does this stream's turn currently live in the viewed branch?
      const onView = () =>
        this.messages.some(m => m.id === pendId || m.id === st.userId || m.id === st.assistantId);

      let resp;
      try {
        resp = await fetch('/api/send', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            content, parent_id: parentId,
            attachments: ready.map(a => ({filename: a.filename, path: a.path, mime: a.mime})),
          }),
          signal: st.abortCtrl.signal,
        });
      } catch (e) {
        if (st.stopped || (e && e.name === 'AbortError')) {
          await this.discardStream(st.assistantId || tempKey);
          return;
        }
        // Network-level failure: the turn never started. Restore the composer
        // and drop the pending row instead of leaving a hung spinner.
        toast('Send failed: ' + (e && e.message ? e.message : e), 'error');
        this.failSend(st);
        return;
      }
      if (!resp.ok) {
        // HTTP error (e.g. 400): the body is JSON, not SSE — handle it here
        // instead of feeding it to consumeStream, which would silently hang.
        if (st.stopped) { await this.discardStream(tempKey); return; }
        toast('Send failed: ' + (await this.errDetail(resp)), 'error');
        this.failSend(st);
        return;
      }
      await this.consumeStream(resp, st, onView);
    },

    // Best-effort extraction of FastAPI's {"detail": …} error body.
    async errDetail(resp) {
      try {
        const d = await resp.json();
        if (d && d.detail) return typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail);
      } catch (e) { /* fall through */ }
      return 'HTTP ' + resp.status;
    },

    // A send that never reached the model: drop the pending row + stream entry
    // and put the text/attachments back in the composer (unless the user has
    // already typed something new).
    failSend(st) {
      const s = {...this.streams};
      if (st.tempKey) delete s[st.tempKey];
      if (st.assistantId) delete s[st.assistantId];
      this.streams = s;
      // The pending row may already carry the real user id (renamed on the
      // user_node event), so drop by both ids.
      const drop = new Set([st.pendId, st.userId, st.assistantId]);
      this.messages = this.messages.filter(m => !drop.has(m.id));
      if (st.userId) {
        // The user node reached the server before the connection died.
        fetch('/api/delete/' + encodeURIComponent(st.userId), {method: 'POST'})
          .then(() => this.refreshTree()).catch(() => {});
      }
      if (!this.draft.trim() && st.typed) {
        this.draft = st.typed;
        const atts = st.attachments || [];
        if (atts.length) this.attachments = [...this.attachments, ...atts];
        this.$nextTick(() => { const el = this.$refs.composerInput; if (el) el.focus(); });
      }
    },

    // Read an SSE response for one stream, updating state/messages. Shared by
    // the initial send() and reconnect() after a refresh. `st.evIndex` tracks
    // how many events have been consumed so a reconnect resumes at the offset.
    async consumeStream(resp, st, onView) {
      const tempKey = st.tempKey;
      let assistantId = st.assistantId;
      let errored = null;
      let gone = false;
      try {
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const {done, value} = await reader.read();
          if (done) break;
          buf += decoder.decode(value, {stream: true});
          const parts = buf.split('\n\n');
          buf = parts.pop();
          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith('data:')) continue;
            const evt = JSON.parse(line.slice(5).trim());
            // `end` is a stream-close marker, not a turn event; don't count it.
            if (evt.type === 'end') continue;
            // `gone`: server has no live buffer for this id (finished + reaped).
            if (evt.type === 'gone') { gone = true; continue; }
            st.evIndex = (st.evIndex || 0) + 1;
            if (evt.type === 'user_node') {
              st.userId = evt.id;
              const pend = this.messages.find(m => m.id === st.pendId);
              if (pend) pend.id = evt.id;
              this.scheduleTreeRefresh();
            } else if (evt.type === 'assistant_node') {
              assistantId = evt.id;
              st.assistantId = evt.id;
              // Re-key the stream from tempKey to the real assistant id.
              if (tempKey && this.streams[tempKey]) {
                const s = {...this.streams};
                delete s[tempKey];
                s[evt.id] = st;
                st.tempKey = null;
                this.streams = s;
              }
              // Append a placeholder row if this branch is being viewed.
              if (this.messages.some(m => m.id === st.userId) &&
                  !this.messages.some(m => m.id === evt.id)) {
                this.messages.push({id: evt.id, role: 'assistant', content: ''});
                this.$nextTick(() => { if (onView()) this.scrollDown(); });
              }
              this.scheduleTreeRefresh();
            } else if (evt.type === 'assistant_start') {
              this.scheduleTreeRefresh();
              this.handleEvent(evt, st, onView);
            } else {
              this.handleEvent(evt, st, onView);
            }
            if (evt.type === 'done' || evt.type === 'error') assistantId = evt.id;
          }
        }
      } catch (e) {
        if (st.stopped || (e && e.name === 'AbortError')) {
          // interrupted by the user — discard this turn entirely
          await this.discardStream(st.assistantId || tempKey);
          return;
        }
        errored = e;
      }

      // If the connection dropped (clean EOF or read error) before the turn
      // settled — no done/error consumed and no `gone` — the reply is still
      // being generated on the server. Auto-resume from the last consumed
      // event instead of leaving a frozen spinner.
      const finished = st._sawDone || gone;
      if (!finished) {
        if (!st.stopped) this.scheduleResume(st, onView);
        return;
      }

      // Capture the streamed result, then settle the placeholder row in place
      // (wherever it currently lives, if the branch is viewed) and drop the
      // live stream so rows render their own persisted content.
      const streamedText = st.text;
      const streamedTools = st.tools.map(t => ({
        name: t.name, arguments: t.arguments, ok: t.ok,
        error: t.error, output: t.output, duration_ms: t.duration_ms,
        images: t.images || 0,
      }));
      const streamedUsage = st.usage;

      if (assistantId) {
        const row = this.messages.find(m => m.id === assistantId);
        if (row) {
          if (streamedText) {
            row.content = streamedText;
            row.tool_results = streamedTools;
            row.usage = streamedUsage;
          }
          // Persisted reasoning renders collapsed; carry the live text over.
          if (st.reasoning) row.reasoning = st.reasoning;
          this.$nextTick(() => { if (onView()) this.scrollDown(); });
        }
      }

      // Remove this stream (whichever key it ended up under).
      const key = st.assistantId || tempKey;
      const s2 = {...this.streams};
      delete s2[key];
      this.streams = s2;

      if (errored) this.status = 'error: ' + errored;
      await this.refreshTree();

      // Stay on the current node (no auto-jump): the user asked here and may
      // want to move on to another branch. Auto-title in the background.
      if (assistantId && this.config.auto_title && !gone) {
        this.autoTitle(assistantId);
      }
    },

    async autoTitle(nodeId) {
      try {
        const resp = await fetch('/api/title/' + encodeURIComponent(nodeId), {method: 'POST'});
        const data = await resp.json();
        if (data && data.ok && data.title) {
          // A new title was set — refresh the tree so the left-pane label shows it.
          await this.refreshTree();
        }
      } catch (e) { /* titling is best-effort; ignore */ }
    },

    // Reconnect a dropped SSE connection, resuming at the last consumed event
    // (st.evIndex). Exponential backoff; after several failures surface a
    // manual retry on the message row (st.resumeFailed).
    scheduleResume(st, onView) {
      if (st.stopped) return;
      if (!st.assistantId) {
        // The connection died before the reply node existed — nothing to
        // resume against. Fail the turn loudly instead of hanging forever.
        toast('Connection lost before the reply started.', 'error');
        this.failSend(st);
        return;
      }
      st.retries = (st.retries || 0) + 1;
      if (st.retries > 5) {
        st.resumeFailed = true;
        return;
      }
      const delay = Math.min(1000 * 2 ** (st.retries - 1), 15000);
      clearTimeout(st._resumeTimer);
      st._resumeTimer = setTimeout(() => this.resumeStream(st, onView), delay);
    },

    async resumeStream(st, onView) {
      const key = st.assistantId;
      if (!key || st.stopped || !this.streams[key]) return;
      let resp;
      try {
        resp = await fetch('/api/stream/' + encodeURIComponent(key) + '?from_index=' + (st.evIndex || 0),
                           {signal: st.abortCtrl.signal});
      } catch (e) {
        if (st.stopped || (e && e.name === 'AbortError')) return;
        this.scheduleResume(st, onView);
        return;
      }
      if (!resp.ok) { this.scheduleResume(st, onView); return; }
      await this.consumeStream(resp, st, onView);
    },

    // Manual retry after auto-resume gave up (row-level "retry" button).
    retryResume(key) {
      const st = this.streams[key];
      if (!st) return;
      st.retries = 0;
      st.resumeFailed = false;
      const onView = () => this.messages.some(m => m.id === key || m.id === st.userId);
      this.resumeStream(st, onView);
    },

    // The streams key whose turn owns a given message row: the assistant id
    // once known, or the pending/real user id while the reply is starting.
    // Lets the stop button appear before the assistant node exists.
    streamKeyFor(mId) {
      if (this.streams[mId]) return mId;
      for (const k in this.streams) {
        const s = this.streams[k];
        if (s.pendId === mId || (s.userId && s.userId === mId)) return k;
      }
      return null;
    },

    stopStream(id) {
      const st = this.streams[id];
      if (!st) return;
      st.stopped = true;
      clearTimeout(st._resumeTimer);
      // Tell the server to halt background generation (it runs detached from
      // this connection), then abort the local SSE read.
      if (st.assistantId) {
        fetch('/api/stop/' + encodeURIComponent(st.assistantId), {method: 'POST'}).catch(() => {});
      }
      if (st.abortCtrl) st.abortCtrl.abort();
    },

    async discardStream(id) {
      // Abort path for one stream: delete its server-side user subtree (the
      // assistant node + folded tool results live under it) and drop its rows.
      const st = this.streams[id];
      const userId = st ? st.userId : null;
      const assistantId = st ? st.assistantId : null;
      const tempKey = st ? st.tempKey : null;
      const pendId = st ? st.pendId : null;
      // When the user explicitly stopped, put their message back in the composer
      // for re-editing (raw typed text + any attachments), unless they've since
      // started typing something new.
      const restore = st && st.stopped;
      const typed = st ? (st.typed || '') : '';
      const atts = st && st.attachments ? st.attachments : [];
      if (userId) {
        try { await fetch('/api/delete/' + userId, {method: 'POST'}); } catch (e) {}
      }
      const drop = new Set([userId, assistantId, pendId]);
      this.messages = this.messages.filter(m => !drop.has(m.id));
      const s = {...this.streams};
      delete s[id];
      if (tempKey) delete s[tempKey];
      this.streams = s;
      if (restore && !this.draft.trim()) {
        this.draft = typed;
        if (atts.length) this.attachments = [...this.attachments, ...atts];
        this.$nextTick(() => { const el = this.$refs.composerInput; if (el) el.focus(); });
        this.refreshIcons();
      }
      await this.refreshTree();
    },

    handleEvent(evt, st, onView) {
      // Coalesce scroll-follow to at most one per animation frame: a burst of
      // deltas would otherwise trigger a forced layout (scrollHeight read)
      // per token.
      const follow = () => {
        if (st._followPending) return;
        st._followPending = true;
        requestAnimationFrame(() => {
          st._followPending = false;
          if (onView && onView()) this.scrollDown();
        });
      };
      // Any concrete progress (reasoning/text/tool/finish) ends the "planning"
      // indicator; a fresh `planning` event re-arms it for the next round.
      if (['reasoning', 'delta', 'tool_call', 'tool_result', 'tool_skipped', 'done', 'error', 'reset'].includes(evt.type)) {
        st.planning = false;
      }
      switch (evt.type) {
        case 'reset':
          // The upstream stream was truncated; the server is regenerating the
          // reply from scratch — drop the partial text and re-render.
          st.text = '';
          st.reasoning = '';
          break;
        case 'assistant_start':
          st.ctx = '· ' + evt.context.messages + ' msgs ~' + evt.context.estimated_tokens + ' tok';
          this.refreshIcons();
          break;
        case 'planning':
          st.planning = true;
          this.refreshIcons();
          follow();
          break;
        case 'reasoning':
          st.reasoning += evt.text;
          follow();
          break;
        case 'delta':
          st.text += evt.text;
          follow();
          break;
        case 'tool_call':
          st.tools.push({
            name: evt.name, arguments: evt.arguments,
            ok: null, output: '', error: '', running: true,
          });
          this.refreshIcons();
          follow();
          break;
        case 'tool_result': {
          // match the most recent running call with the same name
          let rec = null;
          for (let i = st.tools.length - 1; i >= 0; i--) {
            if (st.tools[i].running && st.tools[i].name === evt.name) { rec = st.tools[i]; break; }
          }
          if (!rec) { rec = {name: evt.name, arguments: evt.arguments}; st.tools.push(rec); }
          rec.running = false; rec.ok = evt.ok; rec.output = evt.output || '';
          rec.error = evt.error || ''; rec.duration_ms = evt.duration_ms;
          rec.images = evt.images || 0;
          follow();
          break;
        }
        case 'tool_skipped':
          break;
        case 'done':
          st._sawDone = true;
          // The server sends the scrubbed final text (tool-call markup etc.
          // removed) — swap it in so the settled view matches the persisted one.
          if (typeof evt.content === 'string') st.text = evt.content;
          st.stats = evt.stats;
          st.usage = evt.usage || null;
          // Count session totals once per turn (guard against replay on reconnect).
          if (evt.usage && !st._counted) {
            st._counted = true;
            this.totals.turns += 1;
            this.totals.in += evt.usage.input || 0;
            this.totals.out += evt.usage.output || 0;
            this.totals.cache_read += evt.usage.cache_read || 0;
            this.totals.cache_creation += evt.usage.cache_creation || 0;
          }
          break;
        case 'error':
          st._sawDone = true;
          st.text += '\n\n[error: ' + evt.message + ']';
          break;
      }
    },
  };
}
</script>
</body>
</html>
