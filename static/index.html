<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>chatable</title>
<script>
// Apply the saved appearance before first paint (avoids a theme flash).
try {
  document.documentElement.dataset.theme = localStorage.getItem('chatable.theme') || 'midnight';
  const _fs = parseInt(localStorage.getItem('chatable.fontSize') || '14', 10);
  if (_fs !== 14) document.addEventListener('DOMContentLoaded', () => {
    const conv = document.getElementById('conv');
    if (conv) conv.style.fontSize = _fs + 'px';
  });
} catch (e) { /* localStorage unavailable — defaults apply */ }
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.16.0/dist/cdn.min.js"></script>
<style>
  :root {
    /* dark surface ladder (darkest → raised) */
    --bg: #050608; --panel: #0e1118; --panel-2: #11141b;
    --card: #151922; --card-hover: #252b38; --elevated: #1c2230;
    --border: #1f242e; --border-2: #2a2f3a;
    /* text */
    --fg: #f0f2f5; --dim: #a8adb8; --dim-2: #7a8090;
    /* accents: indigo = primary, amber = branch */
    --accent: #6366f1; --accent-strong: #4f46e5;
    --accent-soft: rgba(99,102,241,.16); --accent-softer: rgba(99,102,241,.07);
    --branch: #d97706; --branch-soft: rgba(217,119,6,.18);
    /* semantic */
    --user: #6366f1; --assistant: #3ec46d; --note: #d97706;
    --ok: #34d399; --fail: #f87171;
    /* radii / shadows / fonts */
    --radius: 10px; --radius-lg: 16px; --radius-xl: 20px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.25);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.40);
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* brand */
    --fg-user-title: #b4b7ff;
    --gradient-brand: linear-gradient(135deg, #6366f1, #a855f7);
    --gradient-user: linear-gradient(135deg, #4f46e5, #6366f1);
  }
  /* ---- theme variants (override the midnight defaults above) ---- */
  :root[data-theme="graphite"] {
    --bg: #0b0d12; --panel: #12151d; --panel-2: #151a24;
    --card: #1a2130; --card-hover: #2a3245; --elevated: #232b3d;
    --border: #262c38; --border-2: #323a49;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f0f1f5;
    --card: #ffffff; --card-hover: #eceef3; --elevated: #e7eaf0;
    --border: #e3e5ec; --border-2: #d3d7e1;
    --fg: #1d2433; --dim: #5c6575; --dim-2: #8b93a4;
    --accent-soft: rgba(99,102,241,.12); --accent-softer: rgba(99,102,241,.06);
    --branch-soft: rgba(217,119,6,.14);
    --fg-user-title: #4f46e5;
    --shadow-sm: 0 1px 2px rgba(15,20,30,.08);
    --shadow-md: 0 4px 14px rgba(15,20,30,.14);
  }
  * { box-sizing: border-box; }
  body { margin: 0;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--fg); height: 100vh; overflow: hidden;
         -webkit-font-smoothing: antialiased; }
  #app { display: grid; grid-template-columns: var(--tree-w, 340px) 6px minmax(0, 1fr); height: 100vh; }
  .panel { height: 100vh; overflow-y: auto; }
  button { cursor: pointer; font-family: inherit; }
  /* keyboard focus indicator — text inputs signal focus via border instead */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input:focus-visible, textarea:focus-visible { outline: none; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  /* custom scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim-2); }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .lucide { width: 1em; height: 1em; stroke-width: 2; vertical-align: -0.14em; display: inline-block; }
  /* ---- drag handle between the two panes ---- */
  #divider { background: var(--border); cursor: col-resize; height: 100vh;
             position: relative; transition: background .12s; }
  #divider:hover, #divider.dragging { background: var(--accent); }
  /* grip dots, centered vertically */
  #divider::after { content: ""; position: absolute; top: 50%; left: 50%;
             width: 2px; height: 22px; transform: translate(-50%, -50%);
             background-image: radial-gradient(var(--dim-2) 40%, transparent 42%);
             background-size: 2px 6px; background-repeat: repeat-y; opacity: .8; }
  #divider:hover::after, #divider.dragging::after {
             background-image: radial-gradient(#fff 40%, transparent 42%); }
  /* widen the actual grab target beyond the visible 6px line */
  #divider::before { content: ""; position: absolute; top: 0; bottom: 0;
             left: -5px; right: -5px; }
  body.col-resizing { cursor: col-resize; user-select: none; }
  /* ---- left: tree ---- */
  #tree { background: var(--panel); border-right: 1px solid var(--border); padding: 0; }
  .topbar { padding: 12px 14px; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; background: var(--panel); z-index: 5; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .logo { flex: none; width: 30px; height: 30px; border-radius: 9px;
            background: var(--gradient-brand); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .2px; }
  .brand .sub { font-size: 12px; color: var(--dim-2); margin-top: 1px; }
  .topbar .meta { font-size: 12px; color: var(--dim-2); word-break: break-all; margin-top: 8px; }
  .topbar .meta.session { color: var(--accent); }
  /* ---- tree search ---- */
  .tree-search { display: flex; align-items: center; gap: 6px; margin-top: 10px;
            background: var(--card); border: 1px solid var(--border-2);
            border-radius: 8px; padding: 5px 8px; transition: border-color .12s; }
  .tree-search:focus-within { border-color: var(--accent); }
  .tree-search .lucide { width: 14px; height: 14px; color: var(--dim-2); flex: none; }
  .tree-search input { flex: 1; min-width: 0; background: transparent; border: 0;
            outline: none; color: var(--fg); font: inherit; font-size: 13px; }
  .tree-search .clear { flex: none; width: 18px; height: 18px; display: flex;
            align-items: center; justify-content: center; background: transparent;
            border: 0; color: var(--dim); border-radius: 4px; }
  .tree-search .clear:hover { color: var(--fg); background: var(--card-hover); }
  .tree-search .clear .lucide { width: 12px; height: 12px; }
  .topbar .meta.search-count { color: var(--dim-2); margin-top: 6px; }
  /* dim non-matching rows; matches stay full-opacity */
  .node-row.search-dim { opacity: .38; }
  .node-label mark, .gallery-card mark { background: rgba(217,119,6,.35); color: var(--fg); font-weight: 600;
            border-radius: 3px; padding: 0 2px; box-shadow: 0 0 0 1px rgba(217,119,6,.5); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .icon-btn { flex: none; width: 30px; height: 30px; display: flex; align-items: center;
            justify-content: center; background: var(--card); border: 1px solid var(--border-2);
            color: var(--dim); border-radius: 8px; font-size: 15px; transition: all .12s; }
  .icon-btn:hover { background: var(--card-hover); color: var(--fg); }
  .icon-btn.danger:hover { color: var(--fail); border-color: var(--fail); background: rgba(248,113,113,.12); }
  .tree-list { padding: 8px 6px; }
  .node-row { display: flex; align-items: flex-start; gap: 5px; padding: 6px 7px;
            border-radius: var(--radius); cursor: pointer; font-size: 14px;
            border: 1px solid transparent; transition: background .12s, border-color .12s; }
  .node-row:hover { background: var(--card); }
  .node-row.notselectable { cursor: default; }
  .node-row.notselectable:hover { background: transparent; }
  .node-row.notselectable .node-label { color: var(--dim); }
  /* subtle per-role tint on the node label text (user vs assistant) */
  .node-row.role-user .node-label .title-line > span:first-of-type { color: var(--fg-user-title); }
  .node-row.role-assistant .node-label .title-line > span:first-of-type { color: var(--fg); }
  .node-row.selected { background: var(--accent-soft); border-color: var(--accent);
            box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .node-row.onpath { background: var(--accent-softer); }
  .guides { flex: none; display: flex; font-family: var(--font-mono);
            color: var(--border-2); user-select: none; align-self: stretch; padding-top: 1px; }
  .guides .guide { display: inline-block; width: 12px; text-align: center; }
  .guides .connector { color: var(--dim-2); }
  .node-caret { flex: none; align-self: flex-start; margin-top: 1px; width: 18px; height: 18px;
            padding: 0; background: transparent; border: 0;
            color: var(--dim); border-radius: 5px; display: flex; align-items: center;
            justify-content: center; transition: all .12s; }
  .node-caret:hover { color: var(--fg); background: var(--card-hover); }
  .node-caret.spacer { cursor: default; visibility: hidden; }
  .node-label .collapsed-badge { color: var(--dim-2); }
  .role-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; }
  .role-user .role-dot { background: var(--user); }
  .role-assistant .role-dot { background: var(--assistant); }
  .role-system_note .role-dot { background: var(--note); }
  /* Streaming node marker: the role dot gets a glowing, expanding halo ring.
     Uses a ::after pseudo (transform/opacity) so the tree pane's overflow
     never clips it, and the dot itself gently breathes. */
  .role-dot.streaming { position: relative; background: var(--accent) !important;
            animation: dot-breathe 1.4s ease-in-out infinite; }
  .role-dot.streaming::after { content: ""; position: absolute; inset: 0;
            border-radius: 50%; background: var(--accent);
            animation: dot-halo 1.4s ease-out infinite; }
  @keyframes dot-breathe {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 6px 1px rgba(99,102,241,0.7); }
    50%      { transform: scale(1.25); box-shadow: 0 0 10px 3px rgba(99,102,241,0.9); }
  }
  @keyframes dot-halo {
    0%   { transform: scale(1);   opacity: 0.55; }
    100% { transform: scale(3.6); opacity: 0;    }
  }
  /* Ring spinner next to a streaming node's label — a crisp, guaranteed cue. */
  .spin { display: inline-block; width: 11px; height: 11px; margin-right: 6px;
            vertical-align: -1px; border: 2px solid rgba(99,102,241,0.25);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .node-label { overflow: hidden; flex: 1; min-width: 0; }
  .node-label .title-line { display: flex; align-items: center; gap: 5px; }
  .node-label .title-line > span:first-of-type { overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
  .node-label .preview { font-size: 12px; color: var(--dim-2); margin-top: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-label .nid { color: var(--dim-2); font-size: 12px; flex: none; }
  .node-label .pin { color: var(--note); flex: none; }
  .node-label .tag { color: var(--accent); font-size: 12px; flex: none; }
  .branch-badge { flex: none; font-size: 10px; font-weight: 600; color: var(--branch);
            background: var(--branch-soft); padding: 1px 5px; border-radius: 5px; }
  .node-dot-live { color: var(--accent); }
  .node-menu-btn { flex: none; opacity: 0; background: transparent; border: 0;
            color: var(--dim-2); width: 22px; height: 22px; display: flex; align-items: center;
            justify-content: center; border-radius: 5px; margin-top: -1px; transition: opacity .12s; }
  .node-row:hover .node-menu-btn, .node-row:focus-within .node-menu-btn { opacity: 1; }
  .node-menu-btn:hover { color: var(--accent); background: var(--accent-soft); }
  /* ---- right: conversation ---- */
  #conv { display: flex; flex-direction: column; height: 100vh; min-width: 0; background: var(--bg); transition: margin-right .2s ease; }
  #messages { flex: 1; overflow-y: auto; padding: 22px 24px; min-width: 0; }
  #messages .inner { max-width: 1000px; margin: 0 auto; }
  .msg { margin-bottom: 18px; animation: fade-in .25s ease-out; display: flex; flex-direction: column; }
  .msg.role-user { align-items: flex-end; }
  .msg .who { font-size: 12px; margin-bottom: 5px; color: var(--dim);
            display: flex; align-items: center; gap: 5px; }
  .msg.role-user .who { color: var(--user); flex-direction: row-reverse; }
  .msg.role-assistant .who { color: var(--assistant); }
  .msg.role-system_note .who { color: var(--note); }
  .msg .who .lucide { width: 13px; height: 13px; }
  .bubble-wrap { position: relative; }
  .bubble { background: var(--card); border: 1px solid var(--border-2);
            border-radius: var(--radius-lg); padding: 11px 15px; overflow-x: auto;
            overflow-wrap: anywhere; max-width: 100%; }
  .msg.role-user .bubble { background: var(--accent); border-color: transparent; color: #fff;
            border-radius: var(--radius-xl); border-top-right-radius: 6px; max-width: 85%; }
  .msg.role-assistant .bubble { border-top-left-radius: 6px; }
  .bubble.note { font-family: var(--font-mono); font-size: 13px; color: var(--dim);
            white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .planning { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
            padding: 7px 11px; font-size: 14px; color: var(--accent);
            background: var(--accent-soft); border: 1px solid var(--accent);
            border-radius: 8px; width: fit-content; }
  /* ---- inline tool calls (folded into the assistant turn) ---- */
  .tool { background: var(--card); border: 1px solid var(--border-2);
            border-radius: var(--radius); margin-bottom: 8px; font-size: 13px; }
  .tool summary { cursor: pointer; padding: 7px 11px; display: flex; align-items: center;
            gap: 8px; list-style: none; user-select: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary .lucide { width: 13px; height: 13px; color: var(--dim); flex: none; }
  .tool .tool-name { color: var(--fg); font-weight: 600; }
  .tool .tool-args { color: var(--dim); font-family: var(--font-mono);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }
  .tool .tool-badge { margin-left: auto; font-size: 12px; padding: 1px 8px; border-radius: 10px; font-weight: 600; }
  .tool .tool-badge.ok { color: var(--ok); background: rgba(52,211,153,.14); }
  .tool .tool-badge.fail { color: var(--fail); background: rgba(248,113,113,.14); }
  .tool .tool-badge.run { color: var(--note); background: var(--branch-soft); }
  .tool .tool-ms { color: var(--dim-2); font-size: 12px; }
  .tool .tool-out { margin: 0; padding: 9px 11px; border-top: 1px solid var(--border-2);
            background: var(--panel-2); white-space: pre-wrap; max-height: 280px; overflow-y: auto;
            font-family: var(--font-mono); font-size: 12px; color: var(--dim);
            border-radius: 0 0 var(--radius) var(--radius); }
  .bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
  .bubble pre { background: var(--panel-2); padding: 11px; border-radius: 8px; overflow-x: auto;
            border: 1px solid var(--border); }
  .bubble code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .msg.role-user .bubble code { background: rgba(255,255,255,.18); }
  .bubble pre code { background: none; padding: 0; }
  .bubble .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; margin: 8px 0; }
  .bubble .katex code { background: none; padding: 0; }
  .stats { font-size: 12px; color: var(--dim-2); margin-top: 5px; }
	  .fork-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
	  .fork-btn { display: inline-flex; align-items: center; gap: 4px;
	            background: transparent; border: 1px solid var(--border-2);
	            color: var(--dim); border-radius: 7px; padding: 3px 10px;
	            font-size: 12px; transition: all .12s; cursor: pointer; font-family: inherit; }
	  .fork-btn:hover { color: var(--branch); border-color: var(--branch);
	            background: var(--branch-soft); }
	  .fork-btn.map-open-btn:hover { color: var(--accent); border-color: var(--accent);
	            background: var(--accent-soft); }
	  .fork-btn .lucide { width: 12px; height: 12px; }
  /* ---- composer ---- */
  #composer { border-top: 1px solid var(--border); padding: 14px 24px 16px; background: var(--panel); }
  #composer .inner { max-width: 1000px; margin: 0 auto; }
  #composer .ctx { font-size: 12px; color: var(--dim-2); margin-bottom: 8px; }
  #composer .ctx .fork { color: var(--branch); }
  .input-wrap { display: flex; align-items: flex-end; gap: 8px;
            background: var(--card); border: 1px solid var(--border-2);
            border-radius: var(--radius-lg); padding: 8px 8px 8px 12px; transition: border-color .12s; }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap textarea { flex: 1; resize: none; min-height: 24px; max-height: 200px;
            overflow: hidden; scrollbar-width: none; -ms-overflow-style: none;
            background: transparent; color: var(--fg); border: 0; outline: none;
            padding: 4px 0; font: inherit; line-height: 1.5; }
  .input-wrap textarea::-webkit-scrollbar { display: none; }

  /* ---- bookmarks sidebar (slides in from the right; fullscreen on mobile) ---- */
  #bookmarks-panel { position: fixed; top: 0; right: 0; width: 320px; height: 100vh; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; z-index: 56; box-shadow: -4px 0 24px rgba(0,0,0,0.25); transform: translateX(105%); visibility: hidden; transition: transform .2s ease, visibility .2s ease; }
  #bookmarks-panel.open { transform: none; visibility: visible; }
  #bookmarks-panel[x-cloak] { display: none !important; }
  /* desktop: the conversation column makes room instead of being covered */
  @media (min-width: 769px) {
    #app.bm-open #conv { margin-right: 320px; }
  }
  .bookmarks-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .bookmarks-head h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .bookmarks-add { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .bookmarks-add input { width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--fg); font: inherit; font-size: 13px; outline: none; }
  .bookmarks-add input:focus { border-color: var(--accent); }
  .bookmarks-list { flex: 1; overflow-y: auto; padding: 8px; }
  .bookmark-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; transition: border-color .12s, background .12s; }
  .bookmark-item:hover { border-color: var(--accent); background: var(--card); }
  .bookmark-item.enriching { border-color: var(--accent); opacity: 0.85; }
  .bookmark-item .title { font-weight: 600; font-size: 13px; line-height: 1.35; margin-bottom: 4px; color: var(--fg); cursor: pointer; }
  .bookmark-item .title:hover { color: var(--accent); }
  .bookmark-item .summary { font-size: 12px; color: var(--dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .bookmark-item .url { font-size: 11px; color: var(--dim-2); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bookmark-item .actions { display: flex; gap: 4px; margin-top: 8px; }
  .bookmark-item .actions button { background: transparent; border: 0; color: var(--dim); padding: 4px; cursor: pointer; border-radius: 5px; }
  .bookmark-item .actions button:hover:not(:disabled) { color: var(--accent); background: var(--card-hover); }
  .bookmark-item .actions button:disabled { cursor: default; }
  .bookmark-empty { padding: 20px 10px; text-align: center; color: var(--dim-2); font-size: 13px; }
  .bm-error { color: var(--fail); font-size: 12px; margin-top: 4px; }
  .bm-rename { width: 100%; font-size: 12px; margin-bottom: 4px; }
  .rotating { animation: spin 0.9s linear infinite; }

  .send-btn { flex: none; width: 34px; height: 34px; display: flex; align-items: center;
            justify-content: center; background: var(--accent); color: #fff; border: 0;
            border-radius: 9px; transition: background .12s; }
  .send-btn:hover:not(:disabled) { background: var(--accent-strong); }
  .send-btn .lucide { width: 17px; height: 17px; }
  #composer .foot { display: flex; align-items: center; gap: 12px; margin-top: 8px;
            font-size: 12px; color: var(--dim-2); }
  #composer .foot .kbd { font-family: var(--font-mono); }
  #composer .foot .streaming-count { color: var(--accent); margin-left: auto; }
  /* ---- attachments (uploaded files) ---- */
  .attach-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .attach-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 320px;
            background: var(--card); border: 1px solid var(--border-2); color: var(--fg);
            border-radius: 8px; padding: 4px 6px 4px 9px; font-size: 13px; }
  .attach-chip .lucide { width: 14px; height: 14px; color: var(--accent); flex: none; }
  .attach-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .name.link { cursor: pointer; }
  .attach-chip .name.link:hover { color: var(--accent); text-decoration: underline; }
  .attach-chip .sz { color: var(--dim-2); flex: none; }
  .attach-chip.uploading { opacity: .7; }
  .attach-chip .x { flex: none; width: 16px; height: 16px; display: flex; align-items: center;
            justify-content: center; border: 0; background: transparent; color: var(--dim);
            border-radius: 4px; }
  .attach-chip .x:hover { color: var(--fail); background: rgba(248,113,113,.12); }
  .attach-chip.failed { border-color: var(--fail); color: var(--fail); }
  .chip-thumb { width: 24px; height: 24px; object-fit: cover; border-radius: 4px; flex: none; }
  /* image thumbnails inside a user message bubble */
  .attach-thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .msg-thumb { max-height: 56px; max-width: 160px; border-radius: 6px;
            border: 1px solid var(--border-2); cursor: pointer; display: block; }
  .msg-thumb:hover { border-color: var(--accent); }
  /* drag-over overlay across the whole app */
  .drop-hint { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
            justify-content: center; background: rgba(99,102,241,.12);
            border: 3px dashed var(--accent); pointer-events: none; }
  .drop-hint .box { background: var(--panel); border: 1px solid var(--accent);
            border-radius: var(--radius-lg); padding: 18px 26px; font-size: 15px; color: var(--fg);
            display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .drop-hint .box .lucide { width: 20px; height: 20px; color: var(--accent); }
  /* ---- settings modal ---- */
  .modal-backdrop { position: fixed; inset: 0; z-index: 60; display: flex;
            align-items: center; justify-content: center; background: rgba(0,0,0,.5);
            animation: fade-in .12s ease; }
  .modal { width: 460px; max-width: calc(100vw - 32px); max-height: calc(100vh - 64px);
            display: flex; flex-direction: column; background: var(--panel);
            border: 1px solid var(--border-2); border-radius: var(--radius-lg);
            box-shadow: 0 16px 50px rgba(0,0,0,.5); }
  .modal-head { display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .modal-head h2 .lucide { width: 16px; height: 16px; color: var(--accent); }
  .modal-body { padding: 14px 16px; overflow-y: auto; }
  .modal-body .hint { font-size: 12px; color: var(--dim-2); margin: 0 0 12px; }
  .modal-body .hint code { background: var(--card); padding: 1px 4px; border-radius: 4px; }
  .fld { display: block; margin-bottom: 11px; }
  .fld > span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px;
            text-transform: uppercase; letter-spacing: .4px; }
  .fld > span .link-btn { float: right; text-transform: none; letter-spacing: 0;
            background: transparent; border: 0; color: var(--accent); font-size: 12px;
            cursor: pointer; padding: 0; }
  .fld > span .link-btn:hover { text-decoration: underline; }
  .fld .fld-note { display: block; font-size: 11px; color: var(--dim-2); margin-top: 3px;
            text-transform: none; letter-spacing: 0; }
  .fld input, .fld select { width: 100%; background: var(--card); color: var(--fg);
            border: 1px solid var(--border-2); border-radius: 8px; padding: 7px 10px;
            font: inherit; font-size: 14px; outline: none; }
  .fld input:focus, .fld select:focus { border-color: var(--accent); }
  .sep { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
  .modal-err { background: rgba(248,113,113,.12); border: 1px solid var(--fail);
            color: var(--fail); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 8px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px;
            padding: 12px 16px; border-top: 1px solid var(--border); }
  /* storage folder picker (browse the server's local filesystem) */
  .path-row { display: flex; gap: 6px; }
  .path-row input { flex: 1; min-width: 0; }
  .path-row .btn-ghost { flex: none; padding: 7px 10px; }
  .fs-picker { border: 1px solid var(--border-2); border-radius: 8px; margin: 4px 0 12px;
            background: var(--card); }
  .fs-head { display: flex; align-items: center; gap: 6px; padding: 7px 10px;
            border-bottom: 1px solid var(--border); font-size: 12px; }
  .fs-head .lucide { width: 13px; height: 13px; color: var(--accent); flex: none; }
  .fs-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; color: var(--fg); font-family: var(--font-mono); font-size: 11px; }
  .fs-hidden-toggle { display: flex; align-items: center; gap: 4px; color: var(--dim-2);
            font-size: 11px; cursor: pointer; flex: none; }
  .fs-close { background: transparent; border: 0; color: var(--dim); padding: 2px; flex: none; }
  .fs-close:hover { color: var(--fg); }
  .fs-list { max-height: 220px; overflow-y: auto; padding: 4px; }
  .fs-row { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 6px;
            font-size: 12px; cursor: pointer; color: var(--fg); }
  .fs-row:hover { background: var(--card-hover); }
  .fs-row .lucide { width: 13px; height: 13px; color: var(--dim); flex: none; }
  .fs-empty { padding: 14px; text-align: center; color: var(--dim-2); font-size: 12px; }
  .fs-err { padding: 6px 10px; color: var(--fail); font-size: 11px; }
  .fs-foot { display: flex; justify-content: flex-end; padding: 8px 10px;
            border-top: 1px solid var(--border); }
  /* appearance: theme chips + font-size stepper */
  .theme-row { display: flex; gap: 8px; }
  .theme-chip { flex: 1; display: flex; align-items: center; gap: 7px; background: var(--card);
            border: 1px solid var(--border-2); border-radius: 8px; padding: 7px 10px;
            color: var(--fg); font-size: 12px; cursor: pointer; font-family: inherit; }
  .theme-chip.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft); }
  .theme-chip .swatch { width: 18px; height: 18px; border-radius: 5px; flex: none;
            border: 1px solid var(--border-2); }
  .sw-midnight { background: linear-gradient(135deg, #050608 60%, #151922); }
  .sw-graphite { background: linear-gradient(135deg, #0b0d12 60%, #1a2130); }
  .sw-light { background: linear-gradient(135deg, #ffffff 60%, #e7eaf0); }
  .zoom-row { display: flex; align-items: center; gap: 10px; }
  .zoom-btn { padding: 5px 12px; }
  .zoom-val { min-width: 46px; text-align: center; color: var(--fg); font-size: 13px;
            font-family: var(--font-mono); }
  .btn-ghost { background: transparent; border: 1px solid var(--border-2); color: var(--fg);
            border-radius: 8px; padding: 7px 14px; font-size: 14px; }
  .btn-ghost:hover { background: var(--card); }
  .btn-primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
            padding: 7px 16px; font-size: 14px; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
  /* per-reply inline stop button in the message header */
  .stop-inline { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px;
            background: transparent; border: 1px solid var(--fail);
            color: var(--fail); border-radius: 6px; padding: 1px 7px; font-size: 11px;
            line-height: 16px; }
  .stop-inline .lucide { width: 10px; height: 10px; }
  .stop-inline:hover { background: var(--fail); color: #fff; }
  /* inline retry shown when auto-resume of a dropped stream gave up */
  .retry-btn { background: transparent; border: 1px solid var(--accent);
            color: var(--accent); border-radius: 6px; padding: 1px 8px;
            font-size: 11px; margin-left: 6px; }
  .retry-btn:hover { background: var(--accent); color: #fff; }
  .retry-btn .lucide { width: 10px; height: 10px; }
  /* ---- empty states ---- */
  .empty { color: var(--dim); text-align: center; margin-top: 40px; }
  .empty-hero { max-width: 560px; margin: 8vh auto 0; text-align: center; }
  .empty-hero .icon { font-size: 44px; margin-bottom: 12px; }
  .empty-hero h2 { font-size: 18px; font-weight: 700; margin: 0 0 8px; color: var(--fg); }
  .empty-hero p { color: var(--dim); margin: 0 0 4px; font-size: 14px; }
  .empty-hero .accent { color: var(--accent); } .empty-hero .branch { color: var(--branch); }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
  .suggestions button { text-align: left; background: var(--card); color: var(--fg);
            border: 1px solid var(--border-2); border-radius: var(--radius); padding: 12px 14px;
            font-size: 14px; line-height: 1.4; transition: all .12s; }
  .suggestions button:hover { background: var(--card-hover); border-color: var(--accent); }

  /* ---- mind map overlay ---- */
  /* tree-row "⋯" dropdown menu: fixed-position, closed via the backdrop */
  .node-menu-backdrop { position: fixed; inset: 0; z-index: 70; }
  .node-menu { position: fixed; z-index: 71; min-width: 150px; background: var(--panel);
            border: 1px solid var(--border-2); border-radius: 10px; padding: 4px;
            box-shadow: var(--shadow-md); display: flex; flex-direction: column;
            animation: fade-in .12s ease; }
  .node-menu-item { display: flex; align-items: center; gap: 8px; background: transparent;
            border: 0; border-radius: 6px; padding: 7px 10px; font-size: 13px;
            cursor: pointer; text-align: left; white-space: nowrap; }
  .node-menu-item .lucide { width: 14px; height: 14px; flex: none; }
  .node-menu-item.mi-export { color: var(--ok); }
  .node-menu-item.mi-map { color: var(--accent); }
  .node-menu-item.mi-rename { color: var(--branch); }
  .node-menu-item.mi-del { color: var(--fail); }
  .node-menu-item.mi-export:hover { background: rgba(52,211,153,.12); }
  .node-menu-item.mi-map:hover { background: var(--accent-soft); }
  .node-menu-item.mi-rename:hover { background: var(--branch-soft); }
  .node-menu-item.mi-del:hover { background: rgba(248,113,113,.12); }
  /* quote-fork popup: floats above a text selection inside a message bubble */
  .quote-pop { position: fixed; z-index: 72; display: flex; align-items: center;
            gap: 5px; padding: 5px 10px; border-radius: 8px; background: var(--panel);
            border: 1px solid var(--border-2); color: var(--fg); font-size: 12.5px;
            box-shadow: var(--shadow-md); cursor: pointer; white-space: nowrap;
            animation: fade-in .12s ease; }
  .quote-pop:hover { color: var(--branch); border-color: var(--branch); }
  .quote-pop .lucide { width: 13px; height: 13px; }
  .rename-input { flex: 1; min-width: 0; background: var(--card);
            border: 1px solid var(--accent); border-radius: 6px; color: var(--fg);
            font: inherit; font-size: 13px; padding: 1px 6px; outline: none; }
  .mindmap-backdrop { position: fixed; inset: 0; z-index: 58; background: var(--bg);
            display: flex; flex-direction: column; animation: fade-in .15s ease; }
  .mindmap-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            border-bottom: 1px solid var(--border); background: var(--panel); }
  .mindmap-head h3 { margin: 0; font-size: 15px; display: flex; align-items: center;
            gap: 8px; flex: 1; min-width: 0; }
  .mindmap-head h3 .lucide { width: 16px; height: 16px; color: var(--accent); flex: none; }
  .mindmap-head h3 .mm-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--dim); font-weight: 400; font-size: 13px; }
  .mindmap-head .count { font-size: 12px; color: var(--dim-2); flex: none; }
  .mindmap-canvas { flex: 1; overflow: hidden; position: relative; cursor: grab;
            touch-action: none;
            background-image: radial-gradient(var(--border) 1px, transparent 1.2px);
            background-size: 26px 26px; }
  .mindmap-canvas.dragging { cursor: grabbing; }
  .mindmap-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .mindmap-canvas.animating .mindmap-world { transition: transform .3s cubic-bezier(.4,0,.2,1); }
  .map-edges { position: absolute; top: 0; left: 0; overflow: visible; }
  .map-edge { fill: none; stroke: #4a5163; stroke-width: 2; }
  .map-node { position: absolute; width: 220px; height: 112px; background: var(--card);
            border: 1px solid var(--border-2); border-radius: var(--radius); padding: 8px 12px;
            cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
            transition: border-color .12s, box-shadow .12s; }
  .map-node:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .map-node.center { border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-soft), 0 4px 18px rgba(99,102,241,.35); }
  .map-q { display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
  .map-q .role-dot { margin-top: 4px; flex: none; }
  .map-q .map-q-text { font-size: 13px; line-height: 1.35; color: var(--fg-user-title);
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .map-a { font-size: 11px; line-height: 1.4; color: var(--assistant); margin-top: 4px;
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .map-a .role-dot { margin-right: 5px; margin-top: 3px; }
  .map-node-foot { display: flex; align-items: center; gap: 6px; }
  .map-del-btn { display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; background: transparent; border: 0;
            color: var(--dim-2); border-radius: 5px; padding: 0; }
  .map-del-btn:hover { color: var(--fail); background: rgba(248,113,113,.12); }
  .map-del-btn .lucide { width: 12px; height: 12px; }
  .map-detail-btn { display: inline-flex; align-items: center; gap: 4px; margin-left: auto;
            background: transparent; border: 1px solid var(--border-2); color: var(--dim);
            border-radius: 6px; padding: 1px 8px; font-size: 11px; }
  .map-detail-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .map-detail-btn .lucide { width: 11px; height: 11px; }

  /* ---- gallery overlay (all conversations as cards) ---- */
  .gallery-backdrop { position: fixed; inset: 0; z-index: 57; background: var(--bg);
            display: flex; flex-direction: column; animation: fade-in .15s ease; }
  .gallery-grid { flex: 1; overflow-y: auto; padding: 18px 22px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px; align-content: start; }
  .gallery-card { background: var(--card); border: 1px solid var(--border-2);
            border-radius: var(--radius); padding: 10px 12px; display: flex;
            flex-direction: column; transition: border-color .12s, box-shadow .12s; }
  .gallery-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .gallery-actions { display: flex; gap: 6px; margin-top: 8px; }
  .gallery-actions button { display: inline-flex; align-items: center; gap: 4px;
            background: transparent; border: 1px solid var(--border-2); color: var(--dim);
            border-radius: 7px; padding: 3px 9px; font-size: 11px; cursor: pointer;
            font-family: inherit; }
  .gallery-actions button:hover { color: var(--accent); border-color: var(--accent);
            background: var(--accent-soft); }
  .gallery-actions button.danger:hover { color: var(--fail); border-color: var(--fail);
            background: rgba(248,113,113,.12); }
  .gallery-actions .lucide { width: 12px; height: 12px; }
  .gallery-search { margin-top: 0; flex: 0 1 300px; }
  .gallery-card.search-hit { border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), var(--shadow-md); }
  .gallery-card.search-dim { opacity: .38; }

  [x-cloak] { display: none !important; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" />
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="/static/css/ui-improvements.css" />
<script src="/static/js/ui-enhancements.js" defer></script>

<body>
<div id="toast-container" aria-live="polite"></div>
<div id="app" x-data="chatable()" x-init="init()" :class="{'bm-open': bookmarksOpen}">

  <!-- mobile header / drawer toggle -->
  <div class="mobile-header">
    <button class="icon-btn" @click="toggleDrawer()" title="Open tree" aria-label="Open tree"><i data-lucide="menu"></i></button>
    <div class="mobile-brand"><div class="logo"><i data-lucide="git-branch"></i></div><span>chatable</span></div>
    <span class="mobile-meta" x-text="config.backend"></span>
    <button class="icon-btn" @click="toggleGallery()" title="Gallery" aria-label="Gallery"><i data-lucide="layout-grid"></i></button>
    <button class="icon-btn" @click="toggleBookmarks()" title="Bookmarks" aria-label="Bookmarks"><i data-lucide="bookmark"></i></button>
  </div>

  <!-- drawer backdrop for mobile -->
  <div class="drawer-backdrop" x-show="drawerOpen" @click="drawerOpen=false"></div>

  <!-- drag-and-drop overlay -->
  <template x-if="dragActive">
    <div class="drop-hint"><div class="box"><i data-lucide="file-up"></i>
      <span>Drop file to attach (PDF, text…)</span></div></div>
  </template>

  <!-- settings modal: model + storage (current process only) -->
  <template x-if="settingsOpen">
    <div class="modal-backdrop" @click.self="closeSettings()">
      <div class="modal" @keydown="trapModalTab($event)">
        <div class="modal-head">
          <h2><i data-lucide="settings"></i> Settings</h2>
          <button class="icon-btn" @click="closeSettings()" title="Close"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
          <p class="hint">Model and storage settings are saved to <code>~/.chatable/settings.json</code> and survive restarts. A reply must not be generating.</p>

          <div>
            <label class="fld">
              <span>Model</span>
              <input type="text" x-model="settings.model" placeholder="type or pick a model" spellcheck="false" />
            </label>
            <label class="fld">
              <span>Base URL</span>
              <input type="text" x-model="settings.base_url" placeholder="https://…" spellcheck="false" />
            </label>
            <label class="fld">
              <span>API Key</span>
              <input type="password" x-model="settings.api_key" :placeholder="config.llm && config.llm.has_api_key ? '•••••• (unchanged)' : ''" spellcheck="false" />
            </label>
          </div>

          <hr class="sep" />

          <div class="fld">
            <span>Theme</span>
            <div class="theme-row">
              <button type="button" class="theme-chip" :class="{active: appearance.theme==='midnight'}" @click="setTheme('midnight')"><span class="swatch sw-midnight"></span>Midnight</button>
              <button type="button" class="theme-chip" :class="{active: appearance.theme==='graphite'}" @click="setTheme('graphite')"><span class="swatch sw-graphite"></span>Graphite</button>
              <button type="button" class="theme-chip" :class="{active: appearance.theme==='light'}" @click="setTheme('light')"><span class="swatch sw-light"></span>Light</button>
            </div>
          </div>
          <div class="fld">
            <span>Chat font size</span>
            <div class="zoom-row">
              <button type="button" class="btn-ghost zoom-btn" @click="adjustFontSize(-1)">A−</button>
              <span class="zoom-val" x-text="appearance.fontSize + 'px'"></span>
              <button type="button" class="btn-ghost zoom-btn" @click="adjustFontSize(1)">A+</button>
            </div>
          </div>

          <hr class="sep" />

          <label class="fld">
            <span>Storage folder</span>
            <div class="path-row">
              <input type="text" x-model="settings.data_dir" placeholder="~/.chatable or /path/to/folder" spellcheck="false" />
              <button type="button" class="btn-ghost" @click="fsBrowse(settings.data_dir)">Browse…</button>
            </div>
          </label>
          <template x-if="fsPicker.open">
            <div class="fs-picker">
              <div class="fs-head">
                <i data-lucide="folder-open"></i>
                <span class="fs-path" x-text="fsPicker.path"></span>
                <label class="fs-hidden-toggle"><input type="checkbox" x-model="fsPicker.showHidden" @change="fsBrowse(fsPicker.path)" /> hidden</label>
                <button class="fs-close" @click="fsPicker.open=false" title="Close"><i data-lucide="x"></i></button>
              </div>
              <div class="fs-list">
                <div class="fs-row" x-show="fsPicker.parent" @click="fsBrowse(fsPicker.parent)"><i data-lucide="corner-left-up"></i> <span>..</span></div>
                <template x-for="d in fsPicker.dirs" :key="d.path">
                  <div class="fs-row" @click="fsBrowse(d.path)"><i data-lucide="folder"></i> <span x-text="d.name"></span></div>
                </template>
                <div class="fs-empty" x-show="!fsPicker.loading && !fsPicker.dirs.length && !fsPicker.parent">empty folder</div>
                <div class="fs-empty" x-show="fsPicker.loading">loading…</div>
              </div>
              <div class="fs-err" x-show="fsPicker.error" x-text="fsPicker.error"></div>
              <div class="fs-foot">
                <button class="btn-primary" @click="settings.data_dir = fsPicker.path; fsPicker.open=false">Select this folder</button>
              </div>
            </div>
          </template>
          <p class="hint">Holds <code>chatable.jsonl</code>. Switching loads that folder's history and is remembered on the next launch.</p>

          <template x-if="settingsError">
            <div class="modal-err" x-text="settingsError"></div>
          </template>
        </div>
        <div class="modal-foot">
          <button class="btn-ghost" @click="closeSettings()">Cancel</button>
          <button class="btn-primary" @click="saveSettings()" :disabled="settingsSaving"
                  x-text="settingsSaving ? 'Saving…' : 'Apply'"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- LEFT: tree -->
  <div id="tree" class="panel" :class="{'open': drawerOpen}">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><i data-lucide="git-branch"></i></div>
        <div>
          <h1>chatable</h1>
          <div class="sub">tree-structured chat</div>
        </div>
      </div>
      <div class="meta" x-text="config.backend"></div>
      <template x-if="sessionStats"><div class="meta session" x-text="sessionStats"></div></template>
      <div class="toolbar">
        <button class="icon-btn" @click="newTrunk()" title="Start a new trunk (clear selection)"><i data-lucide="plus"></i></button>
        <button class="icon-btn" @click="collapseAll()" title="Collapse all nodes"><i data-lucide="chevrons-down-up"></i></button>
        <button class="icon-btn" @click="toggleGallery()" title="Gallery — browse all conversations"><i data-lucide="layout-grid"></i></button>
        <button class="icon-btn" @click="expandAll()" title="Expand all nodes"><i data-lucide="chevrons-up-down"></i></button>
        <button class="icon-btn" @click="toggleBookmarks()" title="Toggle bookmarks"><i data-lucide="bookmark"></i></button>
        <button class="icon-btn" @click="openSettings()" title="Model & storage settings"><i data-lucide="settings"></i></button>
      </div>
      <div class="tree-search">
        <i data-lucide="search"></i>
        <input type="text" x-model="search" @input="rebuildFlat(); refreshIcons()"
               placeholder="Search titles & replies…  (⌘K)" spellcheck="false" />
        <button class="clear" x-show="search" @click="search=''; rebuildFlat(); refreshIcons()" title="Clear"><i data-lucide="x"></i></button>
      </div>
      <template x-if="search.trim()">
        <div class="meta search-count" x-text="searchSummary"></div>
      </template>
    </div>
    <div class="tree-list">
      <template x-if="!tree.children || !tree.children.length">
        <div class="empty" style="font-size:13px;margin-top:20px;">no nodes yet — ask something →</div>
      </template>
      <template x-for="n in flatTree" :key="n.id">
        <div class="node-row" :class="rowClass(n)" role="button" :data-nid="n.id"
             :tabindex="(n.role === 'assistant' || n.role === 'user') ? 0 : -1"
             @click="(n.role === 'assistant' || n.role === 'user') && select(n.id)"
             @keydown.enter.space.prevent="(n.role === 'assistant' || n.role === 'user') && select(n.id)"
>
          <span class="guides">
            <template x-for="(line, gi) in n.ancestors" :key="gi">
              <span class="guide" x-text="line ? '│' : ''"></span>
            </template>
            <span class="guide connector" x-text="n.isLast ? '└' : '├'"></span>
          </span>
          <template x-if="n.hasKids">
            <button class="node-caret" :title="n.collapsed ? 'Expand' : 'Collapse'"
                    @click.stop="toggleCollapse(n)"><i :data-lucide="n.collapsed ? 'chevron-right' : 'chevron-down'"></i></button>
          </template>
          <template x-if="!n.hasKids"><span class="node-caret spacer"></span></template>
          <span class="role-dot" :class="['role-' + n.role, {'streaming': !!streams[n.id]}]"></span>
          <span class="node-label">
            <span class="title-line">
              <template x-if="!!streams[n.id]"><span class="spin"></span></template>
              <template x-if="renamingId !== n.id">
                <span x-html="highlight(n.title || n.preview)"></span>
              </template>
              <template x-if="renamingId === n.id">
                <input class="rename-input" type="text" x-model="renameText"
                       @click.stop @keydown.enter.prevent="submitRename(n.id)"
                       @keydown.esc.prevent="renamingId=null" @blur="renamingId=null"
                       spellcheck="false" />
              </template>
              <template x-if="n.kidCount > 1"><span class="branch-badge" x-text="n.kidCount + ' 分支'"></span></template>
              <span class="nid" x-text="'#' + n.id.slice(0,6)"></span>
              <template x-if="n.collapsed"><span class="collapsed-badge" x-text="'⋯'"></span></template>
              <template x-if="n.pinned"><span class="pin"><i data-lucide="pin"></i></span></template>
              <template x-for="t in n.tags"><span class="tag" x-text="'#'+t"></span></template>
            </span>
            <template x-if="n.role === 'assistant' && n.reply_preview">
              <div class="preview" x-html="highlight(n.reply_preview)"></div>
            </template>
          </span>
          <button class="node-menu-btn" title="More actions"
                  @click.stop="openNodeMenu(n, $event)"><i data-lucide="more-horizontal"></i></button>
        </div>
      </template>
    </div>

  </div>

  <!-- draggable divider: resize the tree pane -->
  <div id="divider" @mousedown="startResize($event)" @dblclick="resetTreeWidth()"
       title="Drag to resize · double-click to reset"></div>

  <!-- RIGHT: conversation (clicking the main area dismisses the bookmarks panel) -->
  <div id="conv" @click="bookmarksOpen=false">
    <div id="messages" @scroll.passive="onScroll()">
     <div class="inner">
      <template x-if="!selectedId && !messages.length">
        <div class="empty-hero">
          <div class="icon">🌳</div>
          <h2>Tree-structured research chat</h2>
          <p>Ask anything below to start a new trunk, or click an assistant node
             on the left to <span class="branch">fork</span> from it.</p>
          <p>Every answer can become a fork point — explore branches without
             polluting the <span class="accent">main thread</span>.</p>
          <div class="suggestions">
            <button @click="useSuggestion('Explain the intuition behind rotary position embeddings (RoPE).')">Explain RoPE intuitively</button>
            <button @click="useSuggestion('Summarize the key idea of the Transformer attention mechanism.')">Summarize attention</button>
            <button @click="useSuggestion('Walk me through a proof that √2 is irrational.')">Prove √2 is irrational</button>
            <button @click="useSuggestion('Compare GRPO and PPO for RLHF, with trade-offs.')">GRPO vs PPO</button>
          </div>
        </div>
      </template>
      <template x-for="m in messages" :key="m.id">
        <div class="msg" :id="'msg-' + m.id" :class="'role-' + m.role">
          <div class="who">
            <template x-if="m.role === 'user'"><i data-lucide="user"></i></template>
            <template x-if="m.role === 'assistant'"><i data-lucide="bot"></i></template>
            <template x-if="m.role === 'system_note'"><i data-lucide="wrench"></i></template>
            <span x-text="m.role"></span>
            <span x-text="'#' + m.id.slice(0,6)"></span>
            <template x-if="m.tool"><span x-text="'· ' + m.tool"></span></template>
            <template x-if="streams[m.id] && streams[m.id].ctx"><span x-text="streams[m.id].ctx"></span></template>
            <!-- per-reply stop button: on the assistant row while streaming,
                 and on the pending user row before the reply node exists -->
            <template x-if="streamKeyFor(m.id)">
              <button class="stop-inline" @click="stopStream(streamKeyFor(m.id))" title="Stop this reply"><i data-lucide="square"></i> stop</button>
            </template>
            <!-- regenerate: retry a user message (deletes its replies first) -->
            <template x-if="m.role === 'user' && !streamKeyFor(m.id)">
              <button class="retry-btn" @click="retryUserNode(m.id)" title="Delete all replies to this message and regenerate"><i data-lucide="rotate-ccw"></i> retry</button>
            </template>
          </div>
          <template x-if="m.role === 'system_note'">
            <details class="tool">
              <summary>
                <i data-lucide="wrench"></i>
                <span class="tool-name" x-text="m.tool || m.title || 'tool result'"></span>
                <span class="tool-args" x-text="toolPreview(m.content)"></span>
              </summary>
              <pre class="tool-out" x-text="m.content"></pre>
            </details>
          </template>
          <template x-if="m.role !== 'system_note'">
            <div>
              <!-- uploaded image attachments: thumbnails above the text -->
              <template x-if="m.role === 'user' && m.attachments && m.attachments.length">
                <div class="attach-thumbs">
                  <template x-for="(att, ai) in m.attachments" :key="ai">
                    <a x-show="String(att.mime || '').startsWith('image/')"
                       :href="'/api/files/' + encodeURIComponent(att.filename)">
                      <img class="msg-thumb" :src="'/api/files/' + encodeURIComponent(att.filename)"
                           :alt="att.filename" :title="att.filename" />
                    </a>
                  </template>
                </div>
              </template>
              <!-- tool cards: live tools while this row streams, else persisted -->
              <template x-for="(t, ti) in (streams[m.id] ? streams[m.id].tools : (m.tool_results || []))" :key="ti">
                <details class="tool" :open="t.running === true">
                  <summary>
                    <i data-lucide="wrench"></i>
                    <span class="tool-name" x-text="t.name"></span>
                    <span class="tool-args" x-text="JSON.stringify(t.arguments)"></span>
                    <template x-if="t.running"><span class="tool-badge run">running…</span></template>
                    <template x-if="!t.running && t.ok === true"><span class="tool-badge ok">✓</span></template>
                    <template x-if="!t.running && t.ok === false"><span class="tool-badge fail">✗</span></template>
                    <template x-if="t.duration_ms"><span class="tool-ms" x-text="t.duration_ms + 'ms'"></span></template>
                    <template x-if="t.images"><span class="tool-ms" x-text="'🖼 ' + t.images"></span></template>
                  </summary>
                  <pre class="tool-out" x-text="t.error || t.output || '…'"></pre>
                </details>
              </template>
              <!-- planning: non-streaming tool-decision in progress -->
              <template x-if="streams[m.id] && streams[m.id].planning">
                <div class="planning"><span class="spin"></span>
                  <span>planning next move…</span></div>
              </template>
              <!-- reasoning: live while this row is streaming; auto-collapses
                   once the answer text starts flowing -->
              <template x-if="streams[m.id] && streams[m.id].reasoning">
                <details class="reasoning" :open="!streams[m.id].text">
                  <summary><i data-lucide="sparkles"></i> reasoning</summary>
                  <div x-text="streams[m.id].reasoning"></div>
                </details>
              </template>
              <!-- persisted reasoning after the turn settles (collapsed, like tool cards) -->
              <template x-if="!streams[m.id] && m.reasoning">
                <details class="reasoning">
                  <summary><i data-lucide="sparkles"></i> reasoning</summary>
                  <div x-text="m.reasoning"></div>
                </details>
              </template>
              <!-- body: live text (with … placeholder) while streaming, else persisted -->
              <div class="bubble-wrap">
                <template x-if="streams[m.id]">
                  <div>
                    <div class="bubble streaming-bubble" x-show="streams[m.id].text" x-md="streams[m.id] ? streams[m.id].text : ''"></div>
                    <div class="bubble" x-show="!streams[m.id].text && !streams[m.id].planning"><span style="color:var(--dim)">…</span></div>
                  </div>
                </template>
                <template x-if="!streams[m.id]">
                  <div class="bubble" x-md="m.content"></div>
                </template>
              </div>
              <!-- stats: live while streaming, else persisted usage -->
              <template x-if="streams[m.id] && streams[m.id].stats">
                <div class="stats" x-text="streams[m.id].stats"></div>
              </template>
              <!-- auto-resume gave up: offer a manual retry -->
              <template x-if="streams[m.id] && streams[m.id].resumeFailed">
                <div class="stats"><span style="color:var(--fail)">connection lost.</span><button class="retry-btn" @click="retryResume(m.id)">retry</button></div>
              </template>
              <template x-if="!streams[m.id] && m.usage && (m.usage.input || m.usage.output)">
                <div class="stats" x-text="fmtUsage(m.usage)"></div>
              </template>
              <!-- per-message actions below the bubble, after generation
                   completes: copy for every message; fork/map for assistant -->
              <template x-if="!streams[m.id]">
                <div class="fork-actions">
                  <button class="fork-btn" @click="copyMessage(m)"
                          :title="copiedMsgId === m.id ? '已复制' : '复制内容'">
                    <i :data-lucide="copiedMsgId === m.id ? 'check' : 'copy'"></i>复制
                  </button>
                  <template x-if="m.role === 'assistant'">
                    <button class="fork-btn" @click="forkFromHere(m.id)" title="从此回复分叉追问">
                      <i data-lucide="git-branch"></i>追问
                    </button>
                  </template>
                  <template x-if="m.role === 'assistant'">
                    <button class="fork-btn map-open-btn" @click="openMindmap(m.id)" title="以这条回复为中心打开思维结构图">
                      <i data-lucide="network"></i>思维图
                    </button>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
     </div>
    </div>

    <div id="composer">
     <div class="inner">
      <div class="ctx">
        <template x-if="selectedId"><span>forking from <span class="fork" x-text="'#' + selectedId.slice(0,6)"></span></span></template>
        <template x-if="!selectedId"><span>new trunk (no fork point selected)</span></template>
      </div>
      <!-- attachments -->
      <template x-if="attachments.length">
        <div class="attach-row">
          <template x-for="(a, ai) in attachments" :key="a.uid">
            <span class="attach-chip" :class="{uploading: a.status==='uploading', failed: a.status==='failed'}">
              <img class="chip-thumb" x-show="a.kind==='image' && a.status==='ready'"
                   :src="'/api/files/' + encodeURIComponent(a.filename)" :alt="a.filename" />
              <i x-show="!(a.kind==='image' && a.status==='ready')"
                 :data-lucide="a.status==='uploading' ? 'loader' : (a.status==='failed' ? 'alert-triangle' : 'file-text')"></i>
              <span class="name" :class="{link: a.status==='ready'}"
                    :title="a.status==='ready' ? 'Open in new tab' : ''"
                    @click="a.status==='ready' && window.open('/api/files/' + encodeURIComponent(a.filename), '_blank', 'noopener')"
                    x-text="a.filename"></span>
              <span class="sz" x-show="a.size" x-text="fmtSize(a.size)"></span>
              <button class="x" @click="removeAttachment(a.uid)" title="Remove"><i data-lucide="x"></i></button>
            </span>
          </template>
        </div>
      </template>
      <div class="composer-row">
        <div class="input-wrap">
          <input type="file" x-ref="fileInput" style="display:none"
                 @change="onFilePick($event)" multiple />
          <button class="send-btn attach-btn" style="background:var(--card);color:var(--dim)"
                  @click="$refs.fileInput.click()" title="Attach a file"><i data-lucide="paperclip"></i></button>
          <textarea x-model="draft" x-ref="composerInput" rows="1"
                    @input="autoGrow($event.target)"
                    x-effect="draft, $nextTick(() => autoGrow($refs.composerInput))"
                    @compositionstart="imeComposing = true"
                    @compositionend="imeComposing = false; _imeEndedAt = Date.now()"
                    @keydown.enter="composerEnter($event)"
                    @paste="onPaste($event)"
                    placeholder="Ask something... (Enter to send, Shift+Enter newline, drop files to attach)"></textarea>
        </div>
        <button class="send-btn send-main" @click="send()" :disabled="!canSend()" title="Send (Enter)"><i data-lucide="arrow-up"></i></button>
      </div>
      <div class="foot">
        <span class="kbd">⌘K search</span>
        <span x-text="status"></span>
        <span class="streaming-count" x-show="anyStreaming"
              x-text="Object.keys(streams).length + ' 生成中…'"></span>
      </div>
     </div>
    </div>
  </div>

  <!-- RIGHT: bookmarks -->
  <div id="bookmarks-panel" :class="{'open': bookmarksOpen}" x-cloak>
    <div class="bookmarks-head">
      <h3><i data-lucide="bookmark"></i> Bookmarks</h3>
      <button class="icon-btn" @click="bookmarksOpen=false" title="Close bookmarks"><i data-lucide="x"></i></button>
    </div>
    <div class="bookmarks-add">
      <input type="text" x-model="newBookmarkUrl" @keydown.enter="addBookmark()"
             placeholder="Paste URL and press Enter…" spellcheck="false" />
      <template x-if="bookmarkError"><div class="bm-error" x-text="bookmarkError"></div></template>
    </div>
    <div class="bookmarks-list">
      <template x-if="!bookmarks.length">
        <div class="bookmark-empty">No bookmarks yet.<br>Paste a URL above to save blogs, papers, or articles.</div>
      </template>
      <template x-for="b in bookmarks" :key="b.id">
        <div class="bookmark-item" :class="{'enriching': b.metadata && b.metadata.enriching}">
          <template x-if="bmRenamingId !== b.id">
            <div class="title" @click="openLink(b.url)" title="Open link in new tab" x-text="b.title || b.url"></div>
          </template>
          <template x-if="bmRenamingId === b.id">
            <input class="rename-input bm-rename" type="text" x-model="bmRenameText" @click.stop
                   @keydown.enter.prevent="submitBookmarkRename(b.id)"
                   @keydown.esc.prevent="bmRenamingId=null" @blur="bmRenamingId=null"
                   spellcheck="false" />
          </template>
          <div class="summary" x-text="b.summary || (b.metadata && b.metadata.enriching ? '…' : '(no summary)')"></div>
          <div class="url" x-text="b.url"></div>
          <div class="actions" @click.stop>
            <button @click="regenerateBookmark(b.id)" :disabled="!!(b.metadata && b.metadata.enriching)"
                    title="Regenerate title & summary"><i data-lucide="sparkles" :class="{'rotating': b.metadata && b.metadata.enriching}"></i></button>
            <button @click="openLink(b.url)" title="Open link in new tab"><i data-lucide="external-link"></i></button>
            <button @click="copyBookmark(b)" title="Copy bookmark"><i data-lucide="copy"></i></button>
            <button @click="discussBookmark(b)" title="Discuss in chat (pastes a prompt into the composer)"><i data-lucide="message-square"></i></button>
            <button @click="startBookmarkRename(b)" title="Rename (submit empty to restore auto title)"><i data-lucide="pencil"></i></button>
            <button @click="deleteBookmark(b.id)" title="Delete"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- tree-row "⋯" action menu -->
  <template x-if="nodeMenu.node">
    <div class="node-menu-backdrop" @click="nodeMenu.node=null" @contextmenu.prevent="nodeMenu.node=null">
      <div class="node-menu" :style="`left:${nodeMenu.x}px; top:${nodeMenu.y}px`" @click.stop>
        <button class="node-menu-item mi-export" x-show="nodeMenu.node.depth === 0"
                @click="nodeMenuAction('export')"><i data-lucide="download"></i>导出 Markdown</button>
        <button class="node-menu-item mi-map"
                @click="nodeMenuAction('map')"><i data-lucide="network"></i>思维图</button>
        <button class="node-menu-item mi-rename"
                @click="nodeMenuAction('rename')"><i data-lucide="pencil"></i>编辑名称</button>
        <button class="node-menu-item mi-del"
                @click="nodeMenuAction('delete')"><i data-lucide="trash-2"></i>删除节点</button>
      </div>
    </div>
  </template>

  <!-- quote-fork popup: appears above a text selection inside a message bubble.
       mousedown.prevent so the selection survives until quoteAsk reads it. -->
  <template x-if="quotePop.show">
    <button class="quote-pop" :style="`left:${quotePop.x}px; top:${quotePop.y}px`"
            @mousedown.prevent="quoteAsk()" title="基于选中内容追问">
      <i data-lucide="message-circle-question"></i>追问
    </button>
  </template>

  <!-- FULLSCREEN: mind map overlay -->
  <template x-if="mindmap.open">
    <div class="mindmap-backdrop">
      <div class="mindmap-head">
        <h3><i data-lucide="network"></i> Mind map
          <span class="mm-title" x-text="mindmap.centerTitle"></span></h3>
        <span class="count" x-text="mindmap.nodes.length + ' nodes · drag to pan · scroll to zoom · click a node to center'"></span>
        <button class="icon-btn" @click="mapZoom(0.8)" title="Zoom out"><i data-lucide="minus"></i></button>
        <span class="count" x-text="Math.round(mapView.scale * 100) + '%'"></span>
        <button class="icon-btn" @click="mapZoom(1.25)" title="Zoom in"><i data-lucide="plus"></i></button>
        <button class="icon-btn" @click="closeMindmap()" title="Close (Esc)"><i data-lucide="x"></i></button>
      </div>
      <div class="mindmap-canvas" x-ref="mapCanvas"
           :class="{animating: mapAnim, dragging: mapDragging}"
           @pointerdown="mapPointerDown($event)"
           @wheel.prevent="mapWheel($event)">
        <div class="mindmap-world"
             :style="`width:${mindmap.w}px; height:${mindmap.h}px; transform: translate(${mapView.tx}px, ${mapView.ty}px) scale(${mapView.scale});`">
          <svg class="map-edges" :width="mindmap.w" :height="mindmap.h">
            <path class="map-edge" :d="mindmap.edgesD"></path>
          </svg>
          <template x-for="mn in mindmap.nodes" :key="mn.id">
            <div class="map-node" :class="{center: mn.isCenter}"
                 :style="`left:${mn.x}px; top:${mn.y}px;`"
                 :title="mn.q || mn.a"
                 @click.stop="mapNodeClick(mn)">
              <div class="map-q" x-show="mn.isPair">
                <span class="role-dot role-user" :class="{'streaming': !!(streams[mn.id] || (mn.replyId && streams[mn.replyId]))}"></span>
                <span class="map-q-text" x-text="mn.q"></span>
              </div>
              <div class="map-a" x-show="mn.a">
                <span class="role-dot role-assistant" x-show="!mn.isPair"></span><span x-text="mn.a"></span>
              </div>
              <div class="map-node-foot">
                <button class="map-del-btn" x-show="mn.isTrunk" @click.stop="exportTree(mn.id)"
                        title="导出整棵对话树为 Markdown">
                  <i data-lucide="download"></i>
                </button>
                <button class="map-del-btn" @click.stop="mapDeleteNode(mn)" title="删除该节点及其所有子节点">
                  <i data-lucide="trash-2"></i>
                </button>
                <template x-if="mn.kidCount > 1"><span class="branch-badge" x-text="mn.kidCount + ' 分支'"></span></template>
                <button class="map-detail-btn" @click.stop="mapShowDetail(mn.replyId || mn.id)" title="Open this conversation">
                  <i data-lucide="message-square"></i>查看细节
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- FULLSCREEN: gallery overlay (all trunk conversations as cards) -->
  <template x-if="galleryOpen">
    <div class="gallery-backdrop">
      <div class="mindmap-head">
        <h3><i data-lucide="layout-grid"></i> Gallery
          <span class="mm-title">all conversations</span></h3>
        <div class="tree-search gallery-search">
          <i data-lucide="search"></i>
          <input type="text" x-model="gallerySearch"
                 placeholder="Search conversations…" spellcheck="false" />
          <button class="clear" x-show="gallerySearch" @click="gallerySearch=''" title="Clear"><i data-lucide="x"></i></button>
        </div>
        <span class="count" x-text="galleryCountText"></span>
        <button class="icon-btn" @click="closeGallery()" title="Close (Esc)"><i data-lucide="x"></i></button>
      </div>
      <div class="gallery-grid">
        <template x-if="!galleryItems.length">
          <div class="bookmark-empty">No conversations yet.</div>
        </template>
        <template x-for="g in galleryItems" :key="g.id">
          <div class="gallery-card" :class="galleryCardClass(g)">
            <div class="map-q"><span class="role-dot role-user"></span><span class="map-q-text" x-html="galleryHighlight(g.q)"></span></div>
            <div class="map-a" x-show="g.a" x-html="galleryHighlight(g.a)"></div>
            <div class="gallery-actions">
              <button class="danger" @click="galleryDelete(g)" title="Delete this conversation and all its branches">
                <i data-lucide="trash-2"></i>删除</button>
              <button @click="galleryDetail(g)" title="Open this conversation">
                <i data-lucide="message-square"></i>查看细节</button>
              <button @click="galleryMap(g)" title="Open the mind map of this conversation">
                <i data-lucide="network"></i>思维图</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<script>
// Register an `x-md` directive: renders markdown into the element, then runs
// KaTeX over the result so $…$ / $$…$$ / \(…\) / \[…\] become formulas.
// Math spans are protected from the markdown pass so underscores/backslashes
// inside them are not mangled.
document.addEventListener('alpine:init', () => {
  Alpine.directive('md', (el, { expression }, { evaluateLater, effect }) => {
    const getText = evaluateLater(expression);
    let latest = '';
    let scheduled = false;
    let lastRender = 0;
    const render = () => {
      lastRender = performance.now();
      el.innerHTML = renderMarkdownWithMath(latest || '');
      renderMathIn(el);
      // Skip expensive highlighting/copy-button scans while a message is
      // still streaming; the final persisted render will run them.
      if (!el.classList.contains('streaming-bubble')) {
        highlightCodeBlocks(el);
        addCodeCopyButtons(el);
      }
    };
    effect(() => {
      getText(text => {
        latest = text;
        if (!el.classList.contains('streaming-bubble')) {
          render();
          return;
        }
        // Streaming bubbles re-render on every token; coalesce to at most one
        // render per ~80ms so per-token markdown+KaTeX stays bounded. Trailing
        // semantics: the newest text is always what gets rendered.
        if (scheduled) return;
        scheduled = true;
        const wait = Math.max(0, 80 - (performance.now() - lastRender));
        setTimeout(() => requestAnimationFrame(() => {
          scheduled = false;
          if (el.isConnected) render();
        }), wait);
      });
    });
  });
});

// Collapse the machine-facing attachment preamble into a clean, clickable
// file list: hides the web_fetch instructions and the server path, keeps just
// the filename as a link. Handles both the current markdown-link format and
// legacy plain-text messages (link rebuilt from the path's basename).
function formatAttachmentBlock(text) {
  if (!text || !text.startsWith('Attached file(s)')) return text;
  const lines = text.split('\n');
  const items = [];
  let i = 1;  // line 0 is the instruction sentence
  for (; i < lines.length; i++) {
    const l = lines[i];
    if (!l.startsWith('- ')) break;
    // Current: - [name](/api/files/name): /server/path
    let m = l.match(/^- \[(.+?)\]\((\/api\/files\/[^)]+)\): .+$/);
    if (m) { items.push(`- 📎 [${m[1]}](${m[2]})`); continue; }
    // Legacy:  - name: /server/path
    m = l.match(/^- ([^:[\]]+): (\/.+)$/);
    if (m) {
      const base = m[2].split('/').pop();
      items.push(`- 📎 [${m[1].trim()}](/api/files/${encodeURIComponent(base)})`);
      continue;
    }
    break;
  }
  if (!items.length) return text;
  const rest = lines.slice(i).join('\n').replace(/^\s+/, '');
  return 'Attachments:\n' + items.join('\n') + (rest ? '\n\n' + rest : '');
}

function renderMarkdownWithMath(text) {
  if (!text) return '';
  text = formatAttachmentBlock(text);
  // 1. Pull out ALL math segments (complete or streaming-incomplete) and
  //    replace with U+E000 (private-use) placeholders so marked never sees
  //    them — a printable-delimiter token keeps this file plain UTF-8 text.
  const math = [];
  const stash = (s) => { math.push(s); return `MATH${math.length - 1}`; };
  let t = text;
  // Display math $$…$$ — content cannot contain $$ (always true for LaTeX).
  // Non-greedy scan stops at the next $$ (closing this block) or end of text
  // (streaming cut-off).  The negative lookahead (?!\$\$) keeps the content
  // from bleeding into a following $$ block when both are incomplete.
  t = t.replace(/\$\$((?:(?!\$\$)[\s\S])*?)(\$\$|$)/g,
    (_, c, e) => stash('$$' + c + (e === '$$' ? '$$' : '')));
  // \[…\] display math  (complete or incomplete)
  t = t.replace(/\\\[((?:(?!\\\])[\s\S])*?)(\\\]|$)/g,
    (_, c, e) => stash('$$' + c + (e === '\\]' ? '$$' : '')));
  // \(…\) inline math  (complete or incomplete)
  t = t.replace(/\\\(((?:(?!\\\))[\s\S])*?)(\\\)|$)/g,
    (_, c, e) => stash('$' + c + (e === '\\)' ? '$' : '')));
  // Inline $…$ — single-line only; avoid $$ already handled above.
  t = t.replace(/(?<!\$)\$(?!\$)([^\n$]*?)(\$|$)/g,
    (_, c, e) => stash('$' + c + (e === '$' ? '$' : '')));
  // 2. Markdown render on the safe remainder.
  let html;
  try { html = marked.parse(t); } catch (e) { html = t; }
  // 3. Restore math placeholders, escaping < > so the browser won't
  //    interpret <i>, <b>, <u> etc. inside formulas as HTML tags.
  html = html.replace(/MATH(\d+)/g, (_, i) =>
    math[+i].replace(/</g, '&lt;').replace(/>/g, '&gt;'));
  return html;
}

function renderMathIn(el) {
  if (typeof renderMathInElement !== 'function') return; // KaTeX not loaded yet
  try {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
      ],
      throwOnError: false,
    });
  } catch (e) { /* leave raw text on failure */ }
}

function chatable() {
  return {
    config: {}, tree: {children: []}, flatTree: [],
    collapsed: new Set(),
    search: '',   // tree filter query; matches node title + summary + preview
    renamingId: null, renameText: '',  // inline tree-row rename state
    nodeMenu: {node: null, x: 0, y: 0},  // tree-row "⋯" dropdown state
    // quote-fork popup: selected text + its message id + fixed-position coords
    quotePop: {show: false, x: 0, y: 0, text: '', msgId: null},
    selectedId: null, messages: [],
    copiedMsgId: null,  // message id whose copy button just succeeded (icon feedback)
    draft: '', status: '',
    // IME (e.g. Chinese pinyin) composition tracking. event.isComposing alone
    // is not reliable: on some browser/IME combos compositionend fires BEFORE
    // the Enter keydown that confirms a candidate, so isComposing is already
    // false and the Enter would wrongly send the message.
    imeComposing: false, _imeEndedAt: 0,
    // Concurrent in-progress replies, keyed by assistant node id (or a temp key
    // until the real id arrives). Each entry:
    //   { userId, parentId, content, text, reasoning, tools:[], stats, ctx,
    //     usage, abortCtrl, stopped, tempKey }
    // A message row whose id is a key here renders that stream's live content
    // instead of its persisted content, so multiple branches can stream at once
    // and navigating between them keeps each one's in-progress reply visible.
    streams: {},
    _tmpSeq: 0,
    lastUsage: null,
    // When the user scrolls up mid-stream we stop forcing the viewport for the
    // currently-viewed branch. `stickToBottom` tracks whether to keep following.
    stickToBottom: true,
    // Tree-pane width (px), draggable via #divider and persisted to localStorage.
    treeWidth: 340, resizing: false,
    // Uploaded-file attachments for the next message. Each: {uid, filename,
    // size, path, status: 'uploading'|'ready'|'failed'}.
    attachments: [],
    _attachSeq: 0,
    dragActive: false, _dragDepth: 0,
    // Settings modal (model + storage). Persisted to settings.json.
    settingsOpen: false, settingsSaving: false, settingsError: '',
    // Appearance (theme + chat font size), persisted to localStorage.
    appearance: { theme: 'midnight', fontSize: 14 },
    FONT_SIZES: [12, 13, 14, 15, 16, 17, 18],

    loadAppearance() {
      const t = localStorage.getItem('chatable.theme');
      const fs = parseInt(localStorage.getItem('chatable.fontSize') || '', 10);
      if (t) this.appearance.theme = t;
      if (!isNaN(fs) && this.FONT_SIZES.includes(fs)) this.appearance.fontSize = fs;
      this.applyAppearance();
    },
    applyAppearance() {
      document.documentElement.dataset.theme = this.appearance.theme;
      // Font size applies to the conversation column only — side panels,
      // modals and overlays keep their own sizing.
      const conv = document.getElementById('conv');
      if (conv) conv.style.fontSize = this.appearance.fontSize + 'px';
      localStorage.setItem('chatable.theme', this.appearance.theme);
      localStorage.setItem('chatable.fontSize', String(this.appearance.fontSize));
    },
    setTheme(t) { this.appearance.theme = t; this.applyAppearance(); },
    adjustFontSize(dir) {
      const steps = this.FONT_SIZES;
      let i = steps.indexOf(this.appearance.fontSize);
      if (i === -1) i = steps.indexOf(14);
      i = Math.min(steps.length - 1, Math.max(0, i + dir));
      this.appearance.fontSize = steps[i];
      this.applyAppearance();
    },
    // Storage-folder browser state (settings modal).
    fsPicker: {open: false, path: '', parent: null, dirs: [], showHidden: false, loading: false, error: ''},
