[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatable"
version = "0.1.0"
description = "Tree-structured research chat web UI for DeepSeek/OpenAI-compatible models."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "weixuansun", email = "weixuansun7@gmail.com"}]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "requests>=2.28",
  "openai>=1.0",
  "PyPDF2>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.scripts]
chatable-web = "server:main"

[project.urls]
Homepage = "https://github.com/weixuansun/chatable"
Repository = "https://github.com/weixuansun/chatable"

[tool.setuptools]
py-modules = ["bookmark_store", "bookmark_service", "jsonl_store", "main", "models", "store", "tools", "web_tools", "service", "server"]
