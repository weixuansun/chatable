[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatable"
version = "0.1.0"
description = "Tree-structured research chat web UI for DeepSeek/OpenAI-compatible models."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "weixuansun", email = "weixuansun7@gmail.com"}]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Single source of truth for dependencies. requirements.txt is only a shim
# pointing here (`-e .`); do not add pins there.
dependencies = [
  "httpx>=0.27",
  "requests>=2.28",
  "openai>=1.0",
  "PyPDF2>=3.0",
  "pymupdf>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Test suite: pip install -e ".[dev]" && pytest
# (httpx is already a runtime dependency; TestClient builds on it.)
dev = [
  "pytest>=8.0",
]

[project.scripts]
chatable-web = "server:main"

[project.urls]
Homepage = "https://github.com/weixuansun/chatable"
Repository = "https://github.com/weixuansun/chatable"

[tool.setuptools]
py-modules = ["bookmark_store", "bookmark_service", "jsonl_store", "main", "models", "report_store", "sqlite_to_jsonl", "store", "tools", "web_tools", "service", "server", "agent_tools", "shell_sandbox", "workspace"]
packages = ["orch"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
